<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KobitWorks kwaoa JSON Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>KobitWorks kwaoa JSON Editor</h1>
    <p>Webサービスに配置する公開用JSONを作成します。自動実行項目は生成しません。</p>
    <div class="actions"><button id="addBtn">メニュー追加</button><button id="loadBtn" class="secondary">JSON読込</button><input id="fileInput" type="file" accept="application/json,.json" hidden></div>
    <div id="editor"></div>
    <div class="actions"><button id="previewBtn">JSON更新</button><button id="downloadBtn">kwaoa.json を保存</button></div>
    <textarea id="output" rows="18" spellcheck="false"></textarea>
  </main>
  <script src="editor.js"></script>
</body>
</html>
