<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>QR・バーコード探索PoC</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#fff}main{max-width:760px;margin:auto;padding:16px}h1{margin-bottom:4px}.version{font-size:14px;color:#bbb;margin-bottom:14px}input,button{font-size:18px;padding:12px;margin:4px 0;box-sizing:border-box}input{width:100%}button{margin-right:8px}.camera{position:relative;width:100%;margin-top:12px;background:#000;overflow:hidden}video{display:block;width:100%;max-height:60vh;background:#000}.marker{position:absolute;display:none;border:4px solid #38ff72;background:rgba(56,255,114,.18);box-shadow:0 0 18px #38ff72;pointer-events:none;z-index:2;border-radius:6px}.status{padding:12px;margin-top:12px;background:#333;border-radius:8px;min-height:1.5em}</style><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script></head><body><main><h1>QR・バーコード探索PoC</h1><div class="version">Version 0.3</div><label>探すコード</label><input id="target" value="4901880816445" type="text" autocomplete="off" autocapitalize="none" spellcheck="false"><div><button id="start">カメラ開始</button><button id="stop">停止</button></div><div id="camera" class="camera"><video id="video" autoplay playsinline muted></video><div id="marker" class="marker"></div></div><div id="status" class="status">待機中</div></main><script>const v=document.querySelector('#video'),s=document.querySelector('#status'),m=document.querySelector('#marker'),t=document.querySelector('#target');let controls=null,reader=null,lastHit='',lastSeen='',lastSeenAt=0;function normalizeForMatch(value){return String(value??'').trim().replace(/^https?:\/\//i,'')}function isMatch(value,target){const a=normalizeForMatch(value),b=normalizeForMatch(target);return !!b&&a===b}function hideMarker(){m.style.display='none'}function showMarker(result){const pts=result&&result.getResultPoints?result.getResultPoints():[];if(!pts||!pts.length||!v.videoWidth||!v.videoHeight){hideMarker();return}const xs=pts.map(p=>p.getX()),ys=pts.map(p=>p.getY());let minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);const padX=Math.max(24,(maxX-minX)*.35),padY=Math.max(24,(maxY-minY)*.6);minX=Math.max(0,minX-padX);maxX=Math.min(v.videoWidth,maxX+padX);minY=Math.max(0,minY-padY);maxY=Math.min(v.videoHeight,maxY+padY);const scale=Math.min(v.clientWidth/v.videoWidth,v.clientHeight/v.videoHeight),drawW=v.videoWidth*scale,drawH=v.videoHeight*scale,offX=(v.clientWidth-drawW)/2,offY=(v.clientHeight-drawH)/2;m.style.left=(offX+minX*scale)+'px';m.style.top=(offY+minY*scale)+'px';m.style.width=Math.max(28,(maxX-minX)*scale)+'px';m.style.height=Math.max(28,(maxY-minY)*scale)+'px';m.style.display='block'}async function start(){stop(false);if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){s.textContent='このブラウザではカメラを利用できません。';return}if(!window.ZXingBrowser){s.textContent='読取ライブラリの読み込みに失敗しました。再読み込みしてください。';return}try{reader=new ZXingBrowser.BrowserMultiFormatReader();s.textContent='カメラを起動しています…';controls=await reader.decodeFromConstraints({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}},v,(result,error)=>{if(!result)return;const value=result.getText(),target=t.value,matched=isMatch(value,target),now=Date.now();if(value!==lastSeen||now-lastSeenAt>700){s.textContent=(matched?'一致しました: ':'検出: ')+value;lastSeen=value;lastSeenAt=now}if(matched){showMarker(result);if(lastHit!==value&&navigator.vibrate)navigator.vibrate([120,60,120]);lastHit=value}else{hideMarker();lastHit=''}});s.textContent='探索中…'}catch(e){s.textContent='カメラ開始エラー: '+(e&&e.message?e.message:e)}}function stop(show=true){if(controls){controls.stop();controls=null}hideMarker();lastHit='';lastSeen='';lastSeenAt=0;if(show)s.textContent='停止しました'}document.querySelector('#start').onclick=start;document.querySelector('#stop').onclick=()=>stop(true);window.addEventListener('resize',hideMarker);</script></body></html>
