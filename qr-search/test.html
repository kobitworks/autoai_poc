<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR・バーコード探索PoC テスト画面</title><style>
body{margin:0;background:#101316;color:#fff;font-family:system-ui,sans-serif}.wrap{max-width:1440px;margin:auto;padding:18px}h1{margin:0 0 6px;font-size:24px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}.toolbar button{font-size:17px;font-weight:700;padding:10px 16px;border:0;border-radius:8px;cursor:pointer}.toolbar button:disabled{opacity:.55;cursor:wait}.imageInfo{font-size:14px;color:#aeb8c1}.note{color:#c9d1d9;margin-bottom:14px}.scene{background:#222;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px #0008}.scene img{display:block;width:100%;height:auto}.legend{margin-top:16px;padding:14px;background:#1b2025;border-radius:10px;line-height:1.7}.legend code{background:#0d1117;padding:2px 5px;border-radius:4px;word-break:break-all}
</style></head><body><div class="wrap"><h1>QR・バーコード探索PoC テスト画面</h1><div class="toolbar"><button id="nextImage">次のテスト画像</button><span id="imageInfo" class="imageInfo">サンプル画像を読み込み中…</span></div><div class="note">QR／バーコードは画面上で生成していません。すべて完成画像の中に読み取り可能な解像度で埋め込んであります。</div><div class="scene"><img id="sceneImage" alt="QR・バーコード探索テスト画像"></div><div id="legend" class="legend"></div></div><script>
const MANIFEST='./test-images-rendered/manifest.json';
const img=document.getElementById('sceneImage'),info=document.getElementById('imageInfo'),btn=document.getElementById('nextImage'),legend=document.getElementById('legend');
let list=[],current=sessionStorage.getItem('qrStaticSampleCurrent')||'',seen=JSON.parse(sessionStorage.getItem('qrStaticSampleSeen')||'[]');

function chooseOrder(items){
  const byDate=Math.random()<.5,asc=Math.random()<.5;
  const sorted=[...items].sort((a,b)=>{
    let n;
    if(byDate){n=String(a.updatedAt||'').localeCompare(String(b.updatedAt||''));}
    else{n=a.name.localeCompare(b.name,'ja',{numeric:true,sensitivity:'base'});}
    if(!n)n=a.name.localeCompare(b.name,'ja',{numeric:true,sensitivity:'base'});
    return asc?n:-n;
  });
  return {sorted,label:(byDate?'更新日順':'名前順')+'・'+(asc?'昇順':'降順')};
}
function pickNext(sorted){
  const unseen=sorted.filter(x=>!seen.includes(x.path)&&x.path!==current);
  if(unseen.length)return unseen[0];
  seen=[];sessionStorage.setItem('qrStaticSampleSeen','[]');
  const i=sorted.findIndex(x=>x.path===current);
  return sorted[(i+1+sorted.length)%sorted.length];
}
function show(item,label){
  current=item.path;
  if(!seen.includes(item.path))seen.push(item.path);
  sessionStorage.setItem('qrStaticSampleCurrent',current);
  sessionStorage.setItem('qrStaticSampleSeen',JSON.stringify(seen));
  img.src='./'+item.path+'?v='+encodeURIComponent(item.updatedAt||item.name);
  info.textContent=item.name+' ／ '+label;
  const c=item.codes||{};
  legend.innerHTML='<b>この画像に焼き込まれているテストコード</b><br>'+
    'URL QR: <code>'+((c.url)||'')+'</code><br>'+
    'QR: '+((c.qr)||[]).map(v=>'<code>'+v+'</code>').join(' / ')+'<br>'+
    'バーコード: '+((c.barcodes)||[]).map(v=>'<code>'+v+'</code>').join(' / ');
}
async function load(){
  btn.disabled=true;
  try{
    const r=await fetch(MANIFEST+'?t='+Date.now());
    if(!r.ok)throw new Error('サンプル画像の生成待ちです');
    list=await r.json();
    if(!list.length)throw new Error('サンプル画像がありません');
    const o=chooseOrder(list);
    const prev=o.sorted.find(x=>x.path===current);
    show(prev||pickNext(o.sorted),prev?'前回表示':o.label);
  }catch(e){info.textContent=e.message;legend.textContent='GitHub Actionsで静的サンプル画像を生成しています。少し待って再読み込みしてください。'}
  finally{btn.disabled=false}
}
btn.onclick=()=>{if(!list.length)return load();const o=chooseOrder(list);show(pickNext(o.sorted),o.label)};
load();
</script></body></html>
