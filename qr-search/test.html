<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR・バーコード探索PoC テスト画面</title><style>body{margin:0;background:#101316;color:#fff;font-family:system-ui,sans-serif}.wrap{max-width:1440px;margin:auto;padding:18px}h1{margin:0 0 6px;font-size:24px}.note{color:#c9d1d9;margin-bottom:14px}.scene{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:12px;background:#333 url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1600&q=85') center/cover no-repeat;box-shadow:0 8px 30px #0008}.scene:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#0000 65%,#0005);pointer-events:none}.tag{position:absolute;background:#fff;color:#111;padding:8px 8px 6px;border-radius:2px;box-shadow:0 2px 8px #0007;text-align:center;z-index:2}.tag .qr{width:110px;height:110px;background:#fff}.tag svg.bar{width:190px;height:85px}.tag small{display:block;font-weight:700;font-size:14px;white-space:nowrap}.q1{left:8%;top:18%}.q2{left:32%;top:48%}.q3{left:57%;top:20%}.q4{left:78%;top:52%}.b1{left:14%;top:65%}.b2{left:56%;top:66%}.legend{margin-top:16px;padding:14px;background:#1b2025;border-radius:10px;line-height:1.7}.legend code{background:#0d1117;padding:2px 5px;border-radius:4px}@media(max-width:800px){.tag{transform:scale(.72);transform-origin:top left}.tag .qr{width:100px;height:100px}.tag svg.bar{width:170px}.legend{font-size:14px}}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script></head><body><div class="wrap"><h1>QR・バーコード探索PoC テスト画面</h1><div class="note">この画面をPCで表示し、別端末またはカメラでコード探索を試してください。QR/バーコードはテスト用に正規生成しています。</div><div class="scene"><div class="tag q1"><div id="q1" class="qr"></div><small>URL QR</small></div><div class="tag q2"><div id="q2" class="qr"></div><small>A1B2C3D4</small></div><div class="tag q3"><div id="q3" class="qr"></div><small>KOBIT2026</small></div><div class="tag q4"><div id="q4" class="qr"></div><small>BOX-QR-003</small></div><div class="tag b1"><svg id="b1" class="bar"></svg></div><div class="tag b2"><svg id="b2" class="bar"></svg></div></div><div class="legend"><b>テストコード</b><br>URL QR: <code>https://example.com/test-package-001</code>（探すコードには <code>example.com/test-package-001</code> と反映）<br>QR: <code>A1B2C3D4</code> / <code>KOBIT2026</code> / <code>BOX-QR-003</code><br>バーコード: <code>4901234567894</code> / <code>4580791234564</code></div></div><script>new QRCode(document.getElementById('q1'),{text:'https://example.com/test-package-001',width:110,height:110,correctLevel:QRCode.CorrectLevel.M});new QRCode(document.getElementById('q2'),{text:'A1B2C3D4',width:110,height:110,correctLevel:QRCode.CorrectLevel.M});new QRCode(document.getElementById('q3'),{text:'KOBIT2026',width:110,height:110,correctLevel:QRCode.CorrectLevel.M});new QRCode(document.getElementById('q4'),{text:'BOX-QR-003',width:110,height:110,correctLevel:QRCode.CorrectLevel.M});JsBarcode('#b1','4901234567894',{format:'EAN13',displayValue:true,height:55,margin:6,fontSize:18});JsBarcode('#b2','4580791234564',{format:'EAN13',displayValue:true,height:55,margin:6,fontSize:18});</script></body></html>
