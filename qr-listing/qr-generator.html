<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>QRコード発行 | QR商品出品支援</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--accent:#2563eb;--accent-soft:#eff6ff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--line)}
.header-inner{max-width:1180px;margin:auto;padding:18px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);margin-bottom:5px}
h1{font-size:27px;margin:0}.version{margin-top:6px;font-size:12px;color:var(--muted)}
main{max-width:1180px;margin:auto;padding:20px 16px 40px}
.back{display:inline-block;margin-bottom:16px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;text-decoration:none;color:var(--text);font-weight:700;font-size:14px}
.desc{margin:0 0 18px;color:var(--muted);line-height:1.65}
.layout{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 3px 14px rgba(15,23,42,.05)}
.panel h2{font-size:19px;margin:0 0 14px}
.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field select{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:12px;font-size:14px;background:#fff}
.field small{display:block;margin-top:5px;color:var(--muted);line-height:1.45}
.inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:grid;gap:9px}
.btn{border:0;border-radius:13px;padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer}
.primary{background:var(--accent);color:#fff}.secondary{background:#eef2ff;color:#1d4ed8}.light{background:#f8fafc;color:#334155;border:1px solid #cbd5e1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.summary{margin-top:13px;padding:11px 12px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;color:var(--muted);font-size:13px;line-height:1.5;word-break:break-all}
.preview-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:12px}.preview-head h2{margin:0}.meta{font-size:13px;color:var(--muted)}
.sheets-wrap{overflow:auto;padding:12px;background:#e2e8f0;border-radius:16px;max-height:78vh}
.sheet{width:297mm;height:210mm;background:#fff;margin:0 auto 12px;padding:14mm 11mm;display:grid;grid-template-columns:repeat(5,55mm);grid-template-rows:repeat(2,91mm);box-shadow:0 8px 28px rgba(15,23,42,.16);flex:0 0 auto}
.qr-card{width:55mm;height:91mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7mm;padding:5mm 3mm;overflow:hidden;background:#fff}
.qr{width:40mm;height:40mm;flex:0 0 40mm;display:flex;align-items:center;justify-content:center}
.qr img,.qr canvas{width:40mm!important;height:40mm!important;display:block}
.human-code{font-family:"Courier New",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:4.5mm;line-height:1.35;letter-spacing:.35mm;text-align:center;font-weight:700;white-space:nowrap;color:#000}
.placeholder{min-height:360px;display:flex;align-items:center;justify-content:center;text-align:center;background:#fff;border:2px dashed #cbd5e1;border-radius:16px;color:#64748b}
.history{margin-top:16px}.history h2{font-size:18px;margin-bottom:10px}.history-list{display:grid;gap:8px}
.history-item{border:1px solid #e2e8f0;border-radius:12px;padding:10px 11px;background:#fff;font-size:12px;line-height:1.5;color:#475569}
.history-item strong{color:#172033}
.history-empty{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 15px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
@media(max-width:700px){.inline{grid-template-columns:1fr}.panel{padding:14px}}
@page{size:A4 landscape;margin:0}
@media print{
  header,.back,.desc,.layout>.panel:first-child,.preview-head,.toast,.history{display:none!important}
  body,main{background:#fff;margin:0;padding:0;max-width:none}
  .layout{display:block}.panel{border:0;box-shadow:none;padding:0}
  .sheets-wrap{padding:0;background:#fff;overflow:visible;max-height:none}
  .sheet{box-shadow:none;margin:0;page-break-after:always;break-after:page}
  .sheet:last-child{page-break-after:auto;break-after:auto}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="eyebrow">QR PRODUCT LISTING SUPPORT</div>
    <h1>QRコード発行</h1>
    <div class="version">PoC Version 0.3</div>
  </div>
</header>

<main>
  <a class="back" href="./index.html">← メニューへ戻る</a>
  <p class="desc">縦型名刺（55×91mm）をA4横に5列×2行で10面配置し、QRコードを上、人読管理コードを下に印字します。発行したシートはA4 PDFとしてダウンロードできます。</p>

  <div class="layout">
    <section class="panel">
      <h2>発行設定</h2>

      <div class="field">
        <label>コード形式</label>
        <input value="QPMS + YYMMDDHHMMSS + 4桁番号" readonly>
        <small>ハイフンなし20文字固定。人読表示は10文字＋10文字の2行です。</small>
      </div>

      <div class="inline">
        <div class="field">
          <label for="startNo">開始補助番号</label>
          <input id="startNo" type="number" min="1" max="9999" value="1">
          <small>0001〜9999で循環します。</small>
        </div>
        <div class="field">
          <label for="count">発行枚数</label>
          <input id="count" type="number" min="10" max="500" step="10" value="10">
          <small>10枚単位、最大500枚。</small>
        </div>
      </div>

      <div class="field">
        <label for="issuedAt">今回の発行日時</label>
        <input id="issuedAt" readonly value="未生成">
      </div>

      <div class="actions">
        <button class="btn primary" id="generateBtn">QRコード生成</button>
        <button class="btn secondary" id="downloadBtn" disabled>PDFダウンロード</button>
        <button class="btn light" id="printBtn" disabled>ブラウザ印刷</button>
      </div>

      <div class="summary" id="summary">まだ生成されていません。</div>

      <div class="history">
        <h2>発行履歴</h2>
        <div class="history-list" id="historyList"></div>
      </div>
    </section>

    <section class="panel">
      <div class="preview-head">
        <h2>印刷プレビュー</h2>
        <div class="meta" id="meta">未生成</div>
      </div>
      <div class="sheets-wrap" id="sheetsWrap">
        <div class="placeholder" id="placeholder">生成すると、A4横・名刺10面のプレビューが表示されます。</div>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var CODE_PREFIX="QPMS";
var HISTORY_KEY="qrListingIssueHistoryV1";
var NEXT_NO_KEY="qrListingNextAuxNoV1";

var issuedAt=document.getElementById("issuedAt");
var startNo=document.getElementById("startNo");
var count=document.getElementById("count");
var sheetsWrap=document.getElementById("sheetsWrap");
var placeholder=document.getElementById("placeholder");
var meta=document.getElementById("meta");
var summary=document.getElementById("summary");
var downloadBtn=document.getElementById("downloadBtn");
var printBtn=document.getElementById("printBtn");
var toast=document.getElementById("toast");
var historyList=document.getElementById("historyList");
var currentBatch=null;

function pad(n,len){return String(n).padStart(len,"0")}
function wrapNo(n){return ((Number(n)-1)%9999+9999)%9999+1}
function compactDateYY(d){return pad(d.getFullYear()%100,2)+pad(d.getMonth()+1,2)+pad(d.getDate(),2)+pad(d.getHours(),2)+pad(d.getMinutes(),2)+pad(d.getSeconds(),2)}
function compactDateFull(d){return ""+d.getFullYear()+pad(d.getMonth()+1,2)+pad(d.getDate(),2)+pad(d.getHours(),2)+pad(d.getMinutes(),2)+pad(d.getSeconds(),2)}
function displayDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1,2)+"-"+pad(d.getDate(),2)+" "+pad(d.getHours(),2)+":"+pad(d.getMinutes(),2)+":"+pad(d.getSeconds(),2)}
function notify(t){toast.textContent=t;toast.classList.add("show");clearTimeout(notify.t);notify.t=setTimeout(function(){toast.classList.remove("show")},1800)}
function readHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]")}catch(e){return []}}
function writeHistory(items){localStorage.setItem(HISTORY_KEY,JSON.stringify(items.slice(0,20)))}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function renderHistory(){
  var items=readHistory();
  historyList.innerHTML="";
  if(!items.length){historyList.innerHTML='<div class="history-empty">発行履歴はまだありません。</div>';return}
  items.forEach(function(item){
    var el=document.createElement("div");el.className="history-item";
    el.innerHTML="<strong>"+escapeHtml(item.display)+"</strong> / "+escapeHtml(String(item.count))+"枚<br>"+escapeHtml(item.firstCode)+" 〜 "+escapeHtml(item.lastCode);
    historyList.appendChild(el);
  });
}

function addHistory(batch){
  var items=readHistory();
  items.unshift({display:batch.display,count:batch.cards.length,firstCode:batch.cards[0].code,lastCode:batch.cards[batch.cards.length-1].code});
  writeHistory(items);
  renderHistory();
}

function makeCard(item){
  var card=document.createElement("div");card.className="qr-card";
  var qr=document.createElement("div");qr.className="qr";
  var code=document.createElement("div");code.className="human-code";
  code.innerHTML="<div>"+item.code.slice(0,10)+"</div><div>"+item.code.slice(10,20)+"</div>";
  card.appendChild(qr);card.appendChild(code);
  new QRCode(qr,{text:item.code,width:180,height:180,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
  return card;
}

function generate(){
  var n=Math.max(1,Math.min(9999,Number(startNo.value||1)));
  var qty=Math.max(10,Math.min(500,Math.floor(Number(count.value||10)/10)*10));
  startNo.value=n;count.value=qty;

  var now=new Date(),stamp=compactDateYY(now),fullStamp=compactDateFull(now),display=displayDate(now);
  var cards=[];
  for(var i=0;i<qty;i++){
    var seq=pad(wrapNo(n+i),4);
    var code=CODE_PREFIX+stamp+seq;
    cards.push({seq:seq,code:code});
  }
  currentBatch={stamp:stamp,fullStamp:fullStamp,display:display,cards:cards};

  sheetsWrap.innerHTML="";
  var pageCount=Math.ceil(cards.length/10);
  for(var p=0;p<pageCount;p++){
    var sheet=document.createElement("div");sheet.className="sheet";
    cards.slice(p*10,p*10+10).forEach(function(item){sheet.appendChild(makeCard(item))});
    sheetsWrap.appendChild(sheet);
  }

  issuedAt.value=display;
  meta.textContent=qty+"枚 / "+pageCount+"ページ / "+cards[0].seq+" → "+cards[cards.length-1].seq;
  summary.innerHTML="QRコード <strong>"+qty+"件</strong>を生成しました。<br>先頭: <strong>"+cards[0].code+"</strong><br>末尾: <strong>"+cards[cards.length-1].code+"</strong>";
  downloadBtn.disabled=false;printBtn.disabled=false;

  var next=wrapNo(n+qty);
  localStorage.setItem(NEXT_NO_KEY,String(next));
  addHistory(currentBatch);
  notify("QRコードを生成しました");
}

async function downloadPdf(){
  if(!currentBatch)return;
  downloadBtn.disabled=true;downloadBtn.textContent="PDF生成中...";
  try{
    var jsPDF=window.jspdf.jsPDF;
    var pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4",compress:true});
    var sheets=Array.prototype.slice.call(document.querySelectorAll(".sheet"));
    for(var i=0;i<sheets.length;i++){
      if(i>0)pdf.addPage("a4","landscape");
      var canvas=await html2canvas(sheets[i],{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false});
      var img=canvas.toDataURL("image/png");
      pdf.addImage(img,"PNG",0,0,297,210,undefined,"FAST");
    }
    var first=currentBatch.cards[0].seq,last=currentBatch.cards[currentBatch.cards.length-1].seq;
    pdf.save("qr_cards_"+currentBatch.fullStamp+"_"+first+"_"+last+".pdf");
    notify("PDFをダウンロードしました");
  }catch(e){
    console.error(e);notify("PDF生成に失敗しました");
  }finally{
    downloadBtn.disabled=false;downloadBtn.textContent="PDFダウンロード";
  }
}

document.getElementById("generateBtn").addEventListener("click",generate);
downloadBtn.addEventListener("click",downloadPdf);
printBtn.addEventListener("click",function(){if(currentBatch)window.print()});

(function init(){
  var saved=Number(localStorage.getItem(NEXT_NO_KEY)||1);
  startNo.value=wrapNo(saved);
  renderHistory();
})();
</script>
</body>
</html>
