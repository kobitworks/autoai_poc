<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品画像アップロード | QR商品出品支援</title><style>
:root{--bg:#080c15;--p:#111827;--line:#263249;--t:#f8fafc;--m:#94a3b8;--a:#67e8f9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#18233d,#080c15 45%);color:var(--t);font-family:system-ui,sans-serif}.w{max-width:980px;margin:auto;padding:22px 16px 50px}.top{display:flex;justify-content:space-between}.top a{color:var(--m);text-decoration:none}.tag{color:var(--a);border:1px solid var(--line);border-radius:20px;padding:6px 10px;font-size:12px}h1{font-size:clamp(32px,6vw,56px);line-height:1;margin:40px 0 12px}.lead{color:var(--m);max-width:680px;line-height:1.7}.p{margin-top:24px;background:rgba(17,24,39,.94);border:1px solid var(--line);border-radius:22px;padding:20px}.drop{border:2px dashed #40506d;border-radius:18px;padding:38px 16px;text-align:center}.drop.drag{border-color:var(--a);background:#0d2530}.drop h2{margin:0 0 8px}.drop p{color:var(--m)}button,.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--a);color:#06202a}.secondary{background:#223047;color:#fff}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.m{background:#0b1220;border:1px solid var(--line);border-radius:13px;padding:12px}.m b{display:block;font-size:20px}.m span{color:var(--m);font-size:12px}.list{display:grid;gap:9px}.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:9px}.item img{width:64px;height:64px;object-fit:cover;border-radius:9px}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub,.status,.history{color:var(--m);font-size:12px}.rm{background:#3b1620;color:#fda4af;padding:8px}.status{margin-top:14px}.ok{color:#86efac}.next{display:none;margin-top:14px}.batch{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:10px 0}.batch:first-child{border-top:0}@media(max-width:650px){.metrics{grid-template-columns:1fr 1fr}.metrics .m:last-child{grid-column:1/-1}}
</style><script src="./poc-store.js"></script></head><body><div class="w"><div class="top"><a href="./">← QR商品出品支援</a><span class="tag">PoC / Step 2</span></div><h1>商品写真を<br>まとめて取り込む。</h1><p class="lead">QRカードと一緒に撮影した写真を複数枚まとめて選択します。次工程でQRを読み取り、商品ごとに自動分類します。</p><section class="p"><div id="drop" class="drop"><h2>画像をドロップ</h2><p>スマホでは「画像を選択」から複数枚選べます。</p><div class="actions"><button id="choose" class="secondary">画像を選択</button><button id="save" class="primary" disabled>アップロード</button></div><input id="input" type="file" accept="image/*" multiple hidden></div><div class="metrics"><div class="m"><b id="count">0</b><span>画像</span></div><div class="m"><b id="size">0 MB</b><span>合計サイズ</span></div><div class="m"><b id="batch">-</b><span>受信バッチ</span></div></div><div id="list" class="list"></div><div id="status" class="status">画像を選択してください。</div><div id="next" class="next"><a id="analyze" class="btn primary" href="./analyze.html">Step 3：QR解析へ →</a></div><p class="status">PoCではGitHub Pages単体で動かすため、画像はこのブラウザのIndexedDBへ保存します。本番は同じUIから受信API／Google Drive等へ接続する想定です。</p></section><section class="p"><h3>このブラウザの履歴</h3><div id="history" class="history"></div></section></div><script>
var files=[],q=function(s){return document.querySelector(s)},input=q('#input'),drop=q('#drop');function bid(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())}function add(fs){Array.from(fs).filter(function(f){return f.type.indexOf('image/')===0}).forEach(function(f){files.push(f)});render()}function render(){q('#list').innerHTML='';files.forEach(function(f,i){var r=document.createElement('div');r.className='item';var im=document.createElement('img'),u=URL.createObjectURL(f);im.src=u;im.onload=function(){URL.revokeObjectURL(u)};var info=document.createElement('div');info.innerHTML='<div class="name"></div><div class="sub">'+(f.size/1024/1024).toFixed(2)+' MB</div>';info.querySelector('.name').textContent=f.name;var b=document.createElement('button');b.className='rm';b.textContent='削除';b.onclick=function(){files.splice(i,1);render()};r.append(im,info,b);q('#list').append(r)});q('#count').textContent=files.length;q('#size').textContent=(files.reduce(function(a,f){return a+f.size},0)/1024/1024).toFixed(2)+' MB';q('#save').disabled=!files.length}async function history(){var a=await AutoAIStore.listBatches(),h=q('#history');h.innerHTML=a.length?'':'まだありません。';a.slice(0,8).forEach(function(x){var r=document.createElement('div');r.className='batch';r.innerHTML='<div><b>'+x.batchId+'</b><div>'+x.count+'枚</div></div><a class="btn secondary" href="./analyze.html?batch='+encodeURIComponent(x.batchId)+'">解析</a>';h.append(r)})}q('#choose').onclick=function(){input.click()};input.onchange=function(e){add(e.target.files);input.value=''};['dragenter','dragover'].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.add('drag')})});['dragleave','drop'].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.remove('drag')})});drop.addEventListener('drop',function(e){add(e.dataTransfer.files)});q('#save').onclick=async function(){var id=bid();q('#save').disabled=true;q('#status').textContent='保存中…';try{await AutoAIStore.saveImages(files,id);q('#batch').textContent=id;q('#status').className='status ok';q('#status').textContent=files.length+'枚を保存しました。受信バッチ: '+id;q('#analyze').href='./analyze.html?batch='+encodeURIComponent(id);q('#next').style.display='block';files=[];render();await history()}catch(e){q('#status').textContent='保存エラー: '+e.message}};render();history();
</script></body></html>
