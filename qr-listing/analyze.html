<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR解析・商品データ | QR商品出品支援</title><style>
:root{--bg:#080c15;--p:#111827;--line:#29364d;--t:#f8fafc;--m:#94a3b8;--a:#67e8f9;--v:#a78bfa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#2b1e4c,#080c15 48%);color:var(--t);font-family:system-ui,sans-serif}.w{max-width:1100px;margin:auto;padding:22px 16px 50px}.top{display:flex;justify-content:space-between}.top a{color:var(--m);text-decoration:none}.tag{border:1px solid var(--line);border-radius:20px;padding:6px 9px;font-size:12px;color:#c4b5fd}h1{font-size:clamp(32px,6vw,54px);line-height:1;margin:40px 0 12px}.lead{color:var(--m);line-height:1.7}.p{margin-top:20px;background:rgba(17,24,39,.95);border:1px solid var(--line);border-radius:20px;padding:18px}.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center}select,input,textarea{background:#0a1220;color:#fff;border:1px solid #3a4966;border-radius:9px;padding:9px;font:inherit}select{min-width:210px}button,.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:var(--a);color:#05202a}.purple{background:var(--v);color:#160b2a}.secondary{background:#24324a;color:#fff}.status,.note{color:var(--m);font-size:12px;line-height:1.6;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.card{display:grid;grid-template-columns:92px 1fr;gap:10px;border:1px solid var(--line);border-radius:13px;padding:9px}.card img{width:92px;height:86px;object-fit:cover;border-radius:8px}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qr{display:flex;gap:6px;margin-top:7px}.qr input{min-width:0;width:100%}.tiny{padding:7px;background:#25334b;color:#fff}.group{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.group h3{margin:0 0 8px}.files{color:var(--m);font-size:12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.f label{display:block;font-size:11px;color:var(--m);margin-bottom:4px}.f input,.f textarea{width:100%}.f textarea{min-height:80px}.wide{grid-column:1/-1}.bar{height:7px;background:#09101b;border-radius:20px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--v),var(--a))}@media(max-width:760px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.wide{grid-column:auto}select{width:100%}}
</style><script src="./poc-store.js"></script><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><div class="w"><div class="top"><a href="./upload.html">← 商品画像アップロード</a><span class="tag">PoC / Step 3</span></div><h1>QRでまとめて、<br>商品データにする。</h1><p class="lead">写真内のQRを読み取り、商品ごとの仮想フォルダへ分類。管理コード＋連番へファイル名を変換し、ZIP出力と商品情報JSONを作成します。</p><section class="p"><div class="tools"><select id="batch"></select><button id="load" class="secondary">読込</button><button id="scan" class="purple">QRを一括解析</button><button id="zip" class="primary" disabled>商品別ZIPを出力</button></div><div id="status" class="status">バッチを選択してください。</div><div class="bar"><i id="bar"></i></div><div id="images" class="grid"></div></section><section class="p"><div class="tools"><b>商品グループ</b><select id="channel"><option value="mercari">メルカリ</option><option value="generic">汎用EC</option></select><button id="draft" class="secondary">商品情報フォームを作成</button></div><div id="groups"></div><p class="note">QR解析・分類・リネーム・ZIP生成は実動します。ChatGPT画像解析は静的GitHub PagesからAPIキーを安全に扱えないため未接続です。PoCではAI解析結果を受け取る商品データ構造・編集・保存・出力まで実装しています。</p></section></div><script>
var q=function(s){return document.querySelector(s)},images=[],groups={},current='';function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function ext(x){var m=(x.originalName||'').match(/\.([a-z0-9]{2,5})$/i);return m?m[1].toLowerCase():(x.mimeType==='image/png'?'png':'jpg')}function norm(s){s=String(s||'').trim();if(!s)return'';var m=s.match(/QR[-_ ]?[A-Z0-9-]{3,}/i);if(m)return m[0].replace(/_/g,'-').replace(/\s+/g,'-').toUpperCase();try{var u=new URL(s),x=decodeURIComponent(u.pathname.split('/').filter(Boolean).pop()||'');return norm(x)||x}catch(e){}return s.slice(0,64)}async function decode(blob){if('BarcodeDetector' in window){try{var f=await BarcodeDetector.getSupportedFormats();if(f.indexOf('qr_code')>=0){var d=new BarcodeDetector({formats:['qr_code']}),b=await createImageBitmap(blob),r=await d.detect(b);b.close();if(r[0]&&r[0].rawValue)return r[0].rawValue}}catch(e){}}if(window.ZXingBrowser){var u=URL.createObjectURL(blob);try{var z=new ZXingBrowser.BrowserQRCodeReader(),x=await z.decodeFromImageUrl(u);return x&&x.getText?x.getText():''}catch(e){}finally{URL.revokeObjectURL(u)}}return''}async function init(){var a=await AutoAIStore.listBatches(),s=q('#batch');s.innerHTML='';a.forEach(function(x){var o=document.createElement('option');o.value=x.batchId;o.textContent=x.batchId+' ('+x.count+'枚)';s.append(o)});var p=new URLSearchParams(location.search).get('batch');if(p)s.value=p;if(a.length)await load()}async function load(){current=q('#batch').value;images=await AutoAIStore.getImages(current);renderImages();build();q('#zip').disabled=!images.length;q('#status').textContent=images.length+'枚を読み込みました。'}function renderImages(){var box=q('#images');box.innerHTML='';images.forEach(function(x){var c=document.createElement('div');c.className='card';var im=document.createElement('img'),u=URL.createObjectURL(x.blob);im.src=u;im.onload=function(){URL.revokeObjectURL(u)};var i=document.createElement('div');i.innerHTML='<div class="name">'+esc(x.originalName)+'</div><div class="status">'+(x.virtualName?esc(x.virtualName):'未分類')+'</div><div class="qr"><input value="'+esc(x.qrCode||'')+'"><button class="tiny">適用</button></div>';var inp=i.querySelector('input');i.querySelector('button').onclick=async function(){x=await AutoAIStore.updateImage(x.id,{qrCode:norm(inp.value)||'UNREAD'});var n=images.findIndex(function(y){return y.id===x.id});images[n]=x;build();renderImages()};c.append(im,i);box.append(c)})}function build(){groups={};images.forEach(function(x){var c=x.qrCode||'UNREAD';(groups[c]||(groups[c]=[])).push(x)});Object.keys(groups).forEach(function(c){groups[c].sort(function(a,b){return a.originalName.localeCompare(b.originalName,'ja')}).forEach(function(x,i){x.virtualName=c+'_'+String(i+1).padStart(2,'0')+'.'+ext(x)})});renderGroups()}function field(label,name,val,area){return '<div class="f'+(area?' wide':'')+'"><label>'+label+'</label>'+(area?'<textarea data-f="'+name+'">'+esc(val||'')+'</textarea>':'<input data-f="'+name+'" value="'+esc(val||'')+'">')+'</div>'}async function renderGroups(){var box=q('#groups');box.innerHTML='';for(var c of Object.keys(groups)){var a=groups[c],p=await AutoAIStore.getProduct(c),d=document.createElement('div');d.className='group';var list=a.map(function(x){return '<li>'+esc(x.virtualName)+' ← '+esc(x.originalName)+'</li>'}).join(''),form='';if(p)form='<div class="form">'+field('商品名','title',p.title)+field('カテゴリ','category',p.category)+field('ブランド','brand',p.brand)+field('状態','condition',p.condition)+field('価格','price',p.price)+field('在庫','stock',p.stock)+field('商品説明','description',p.description,true)+field('チャネル固有情報','channelMemo',p.channelMemo,true)+'</div><div class="tools" style="margin-top:8px"><button class="tiny save">保存</button><button class="tiny json">JSON</button></div>';d.innerHTML='<h3>'+esc(c)+' <span class="status">'+a.length+'枚</span></h3><ul class="files">'+list+'</ul>'+form;if(p){d.querySelector('.save').onclick=(function(div,code,arr){return async function(){await AutoAIStore.putProduct(read(div,code,arr));q('#status').textContent=code+' を保存しました。'}})(d,c,a);d.querySelector('.json').onclick=(function(div,code,arr){return function(){download(new Blob([JSON.stringify(read(div,code,arr),null,2)],{type:'application/json'}),code+'.json')}})(d,c,a)}box.append(d)}}function read(d,c,a){var g=function(n){var e=d.querySelector('[data-f="'+n+'"]');return e?e.value:''};return {code:c,channel:q('#channel').value,imageCount:a.length,files:a.map(function(x){return x.virtualName}),title:g('title'),category:g('category'),brand:g('brand'),condition:g('condition'),price:g('price'),stock:Number(g('stock')||1),description:g('description'),channelMemo:g('channelMemo')}}q('#load').onclick=load;q('#batch').onchange=load;q('#scan').onclick=async function(){if(!images.length)return;q('#scan').disabled=true;for(var i=0;i<images.length;i++){var raw=await decode(images[i].blob),code=norm(raw);images[i]=await AutoAIStore.updateImage(images[i].id,{qrCode:code,status:code?'grouped':'unread'});q('#bar').style.width=((i+1)/images.length*100)+'%';q('#status').textContent='QR解析 '+(i+1)+'/'+images.length}build();renderImages();q('#scan').disabled=false;q('#status').textContent='解析完了。商品 '+Object.keys(groups).filter(function(x){return x!=='UNREAD'}).length+'件 / 未読 '+((groups.UNREAD||[]).length)+'枚'};q('#draft').onclick=async function(){for(var c of Object.keys(groups)){if(c==='UNREAD')continue;var old=await AutoAIStore.getProduct(c);if(!old)await AutoAIStore.putProduct({code:c,channel:q('#channel').value,imageCount:groups[c].length,files:groups[c].map(function(x){return x.virtualName}),title:'',category:'',brand:'',condition:'',price:'',stock:1,description:'管理コード: '+c+'\n画像: '+groups[c].length+'枚',channelMemo:q('#channel').value==='mercari'?'配送負担・配送方法・発送元・発送までの日数を設定':'チャネル固有項目を設定'})}await renderGroups();q('#status').textContent='商品情報フォームを作成しました。'};q('#zip').onclick=async function(){var z=new JSZip();for(var c of Object.keys(groups)){var f=z.folder(c);groups[c].forEach(function(x){f.file(x.virtualName,x.blob)});var p=await AutoAIStore.getProduct(c);if(p)f.file('product.json',JSON.stringify(p,null,2))}download(await z.generateAsync({type:'blob'}),'qr-products-'+current+'.zip')};function download(blob,name){var a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)}init();
</script></body></html>
