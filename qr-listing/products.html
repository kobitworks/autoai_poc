<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<title>商品一覧 | QR商品出品支援</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--text:#172033;--muted:#667085;--line:#dfe6ee;--cyan:#0891b2;--cyan-soft:#ecfeff;--emerald:#059669;--emerald-soft:#ecfdf5;--amber:#b45309;--amber-soft:#fffbeb;--shadow:0 6px 22px rgba(15,23,42,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,a{font:inherit}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.head{max-width:1120px;margin:auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
.brand{min-width:0}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--cyan)}h1{font-size:23px;margin:2px 0 0}
.head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn,.pill{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:9px 12px;text-decoration:none;font-weight:750;cursor:pointer}
.icon-btn{width:42px;height:42px;padding:0;font-size:20px}
main{max-width:1120px;margin:auto;padding:18px 16px 44px}
.lead{color:var(--muted);line-height:1.7;margin:0 0 16px}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.metric span{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.metric strong{font-size:23px}
.info{background:var(--cyan-soft);border:1px solid #bae6fd;color:#155e75;border-radius:14px;padding:11px 13px;font-size:12px;line-height:1.6;margin-bottom:16px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.toolbar input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;font:inherit}
.status{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card-top{display:flex;gap:10px;align-items:flex-start}.code{font-size:15px;font-weight:850;word-break:break-all}.meta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.55}
.badge{margin-left:auto;white-space:nowrap;border-radius:999px;padding:5px 8px;background:var(--emerald-soft);color:#047857;font-size:10px;font-weight:850}
.badge.warn{background:var(--amber-soft);color:var(--amber)}
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:12px}
.photo{min-width:0}.photo img{width:100%;aspect-ratio:1/1;display:block;object-fit:cover;border-radius:10px;background:#e7edf4;border:1px solid var(--line)}
.photo span{display:block;font-size:9px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:11px;padding:9px 11px;background:#e9f7fb;color:#0e7490;text-decoration:none;font-size:12px;font-weight:800}.btn.ai{background:#ecfdf5;color:#047857}
.detail{font-size:11px;color:var(--muted);margin-left:auto}
.empty{background:#fff;border:2px dashed #cbd5e1;border-radius:18px;padding:38px 18px;text-align:center;color:var(--muted)}
.error{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:14px;padding:14px;line-height:1.6}
@media(max-width:820px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
@media(max-width:520px){h1{font-size:20px}.head{align-items:flex-start}.head-actions .pill{display:none}.summary{gap:8px}.metric{padding:11px}.metric strong{font-size:20px}.photos{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:13px}}
</style>
<script src="./poc-store.js"></script>
</head>
<body>
<header>
  <div class="head">
    <div class="brand">
      <div class="eyebrow">QR PRODUCT LISTING SUPPORT</div>
      <h1>商品一覧</h1>
    </div>
    <div class="head-actions">
      <a class="pill" href="./upload.html">写真アップロード</a>
      <a class="pill" href="./index.html">メニュー</a>
      <button id="reload" class="icon-btn" type="button" aria-label="商品一覧を再読込" title="再読込">↻</button>
    </div>
  </div>
</header>
<main>
  <p class="lead">QR仕分け済みの商品を、ブラウザ内の保存領域から読み込みます。写真本体はIndexedDB内のBlobとして保持し、このPoCでは外部サーバーへ送信しません。</p>
  <div class="summary">
    <div class="metric"><span>商品数</span><strong id="mProducts">0</strong></div>
    <div class="metric"><span>写真数</span><strong id="mImages">0</strong></div>
    <div class="metric"><span>保存容量</span><strong id="mBytes">0 B</strong></div>
    <div class="metric"><span>保存先</span><strong style="font-size:15px">このブラウザ</strong></div>
  </div>
  <div class="info">PoC保存方式: IndexedDB / File・Blob。商品ごとの「AI解析・候補生成」はユーザー操作時だけ端末内AIを実行し、候補をこのブラウザへ保存します。サイトデータ削除や別端末への切替では引き継がれません。</div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="商品ID・商品名・ファイル名で絞り込み">
    <span id="loadState" class="status">読込中…</span>
  </div>
  <div id="list"></div>
</main>
<script>
(function(){
'use strict';
var list=document.getElementById('list');
var search=document.getElementById('search');
var state=document.getElementById('loadState');
var products=[],imageMap={},objectUrls=[];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function bytes(n){n=Number(n||0);if(!n)return '0 B';var u=['B','KB','MB','GB'],i=Math.min(Math.floor(Math.log(n)/Math.log(1024)),3);return (n/Math.pow(1024,i)).toFixed(i?1:0)+' '+u[i]}
function date(s){if(!s)return '—';var d=new Date(s);return isNaN(d.getTime())?s:d.toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function cleanup(){objectUrls.forEach(function(x){URL.revokeObjectURL(x)});objectUrls=[]}
function photoUrl(blob){var x=URL.createObjectURL(blob);objectUrls.push(x);return x}
function searchText(p,imgs){var a=p.aiAnalysis&&p.aiAnalysis.fields?p.aiAnalysis.fields:{},f=p.confirmedProduct&&p.confirmedProduct.fields?p.confirmedProduct.fields:{};return [p.code,p.title,p.category,p.brand,p.color,p.condition,p.status,p.processingState,a.title,a.brand,a.category,a.color,a.features,f.title,f.brand,f.category,f.color,f.condition,f.features].concat((imgs||[]).map(function(x){return x.originalName+' '+x.virtualName})).join(' ').toLowerCase()}

async function load(){
  cleanup();
  state.textContent='読込中…';
  try{
    var summary=await AutoAIStore.getStorageSummary();
    products=await AutoAIStore.listProducts();
    imageMap={};
    var visible=[];
    for(var i=0;i<products.length;i++){
      var p=products[i],imgs=await AutoAIStore.getProductImages(p.code);
      imageMap[p.code]=imgs;
      if(imgs.length)visible.push(p);
    }
    products=visible;
    document.getElementById('mProducts').textContent=String(products.length);
    document.getElementById('mImages').textContent=String(summary.images);
    document.getElementById('mBytes').textContent=bytes(summary.bytes);
    state.textContent='最終読込 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    render();
  }catch(err){
    state.textContent='読込エラー';
    list.className='error';
    list.textContent='ブラウザ内データを読み込めませんでした: '+(err&&err.message?err.message:err);
  }
}

function render(){
  cleanup();
  list.className='';
  var key=search.value.trim().toLowerCase();
  var rows=products.filter(function(p){return !key||searchText(p,imageMap[p.code]).indexOf(key)>=0});
  if(!rows.length){
    list.innerHTML='<div class="empty">'+(products.length?'条件に一致する商品はありません。':'QR解析で商品を確定すると、ここに写真セットが表示されます。')+'</div>';
    return;
  }
  var grid=document.createElement('div');grid.className='grid';
  rows.forEach(function(p){
    var imgs=imageMap[p.code]||[],card=document.createElement('article');card.className='card';
    var batches=(p.batchIds&&p.batchIds.length?p.batchIds:[p.batchId]).filter(Boolean);
    var batch=batches[batches.length-1]||'';
    var process=p.processingState||p.status||'qr_grouped';
    var confirmed=!!(p.confirmedProduct&&p.confirmedProduct.fields);
    var displayFields=confirmed?p.confirmedProduct.fields:(p.aiAnalysis&&p.aiAnalysis.fields?p.aiAnalysis.fields:p);
    var photoHtml=imgs.map(function(x){
      return '<div class="photo"><img src="'+photoUrl(x.blob)+'" alt="'+esc(x.originalName)+'"><span title="'+esc(x.virtualName||x.originalName)+'">'+esc(x.virtualName||x.originalName)+'</span></div>';
    }).join('');
    card.innerHTML=
      '<div class="card-top"><div><div class="code">'+esc(p.code)+'</div><div class="meta">'+imgs.length+'枚 / '+esc(process)+'<br>更新 '+esc(date(p.updatedAt))+'</div></div><span class="badge'+(imgs.length?'':' warn')+'">'+(confirmed?'商品情報確定済み':(imgs.length?'写真保存済':'写真なし'))+'</span></div>'+
      (displayFields.title?'<div class="meta" style="margin-top:8px"><b>'+esc(displayFields.title)+'</b>'+(displayFields.brand?' / '+esc(displayFields.brand):'')+'</div>':'')+
      '<div class="photos">'+photoHtml+'</div>'+
      '<div class="card-actions">'+
      (batch?'<a class="btn" href="./analyze.html?batch='+encodeURIComponent(batch)+'">QR解析で確認</a>':'')+
      (imgs.length?'<a class="btn ai" href="./ai-analysis.html?product='+encodeURIComponent(p.code)+'">'+(confirmed?'商品情報を確認・修正':'AI解析・候補生成')+'</a>':'')+
      '<span class="detail">'+(batches.length?batches.length+'バッチ / ':'')+esc(p.storageMode||'indexeddb-poc')+'</span></div>';
    grid.appendChild(card);
  });
  list.appendChild(grid);
}

document.getElementById('reload').addEventListener('click',load);
search.addEventListener('input',render);
window.addEventListener('beforeunload',cleanup);
if(!window.indexedDB){
  list.className='error';list.textContent='このブラウザではIndexedDBを利用できません。';state.textContent='利用不可';
}else{
  load();
}
})();
</script>
</body>
</html>
