name: P008 provision free Cloudflare preview

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/p008-cloudflare-provision-preview.yml"

permissions:
  contents: read

jobs:
  provision-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Verify Cloudflare account token and access
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            | jq -e '.success == true and .result.status == "active"' >/dev/null
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            | jq -e '.success == true' >/dev/null

      - name: Verify zero-cost Workers subscription
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "${body}" -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/subscriptions" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")"
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::Unable to verify Cloudflare subscriptions (HTTP ${code}). Billing Read permission is required before a P008 Preview can be deployed."
            jq -c '{success,errors}' "${body}" || true
            exit 1
          fi
          jq -e '.success == true' "${body}" >/dev/null
          python3 - "${body}" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding="utf-8"))
          active={"trial","provisioned","paid","awaitingpayment"}
          bad=[]
          for s in data.get("result", []):
              rate=str((s.get("rate_plan") or {}).get("id") or "").upper()
              state=str(s.get("state") or "").lower()
              if "WORKERS" in rate and "FREE" not in rate and state in active:
                  bad.append({"rate_plan":rate,"state":s.get("state")})
          if bad:
              raise SystemExit("Paid/billable Workers subscription detected: "+json.dumps(bad))
          print("WORKERS_FREE_ONLY=true")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        working-directory: web-template
        run: npm install --no-audit --no-fund

      - name: Provision D1 safely without R2
        working-directory: web-template
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/provision_p008_cloudflare.py | tee p008-resources.json
          jq -e '
            .workers_free_guard.checked == true
            and .workers_free_guard.paid_workers_subscription == false
            and .d1.catalog_registered == true
            and .r2_enabled == false
            and .billing_changes == false
            and .production_worker_deployed == false
          ' p008-resources.json >/dev/null

      - name: Render Wrangler config
        working-directory: web-template
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("p008-resources.json").read_text())
          d1=data["d1"]["database_uuid"]
          text=Path("wrangler.p008.template.jsonc").read_text()
          if text.count("__D1_DATABASE_ID__") != 2:
              raise SystemExit("expected two D1 placeholders")
          text=text.replace("__D1_DATABASE_ID__", d1)
          if "__D1_DATABASE_ID__" in text:
              raise SystemExit("D1 placeholder was not fully replaced")
          if "r2_buckets" in text:
              raise SystemExit("R2 binding detected")
          Path("wrangler.p008.generated.jsonc").write_text(text)
          PY

      - name: Deploy develop Preview
        working-directory: web-template
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler preview \
            --name develop \
            --config wrangler.p008.generated.jsonc \
            --ignore-base-config \
            --json \
            > preview.json
          cat preview.json

      - name: Extract Preview URL
        working-directory: web-template
        shell: bash
        run: |
          set -euo pipefail
          preview_url="$(jq -er '.preview.urls[0]' preview.json)"
          case "${preview_url}" in
            https://*.workers.dev|https://*.workers.dev/*) ;;
            *) echo "::error::Unexpected Preview URL: ${preview_url}"; exit 1 ;;
          esac
          printf '%s\n' "${preview_url}" | tee preview-url.txt

      - name: Probe Preview and D1 binding
        working-directory: web-template
        shell: bash
        run: |
          set -euo pipefail
          url="$(cat preview-url.txt)"
          ok=0
          for attempt in $(seq 1 20); do
            if curl -fsS "${url}/health" -o health.json; then
              if jq -e '
                .ok == true
                and .environment == "preview"
                and .db_write_enabled == false
                and .d1_read == true
                and .file_storage_mode == "local-only"
                and .r2_enabled == false
                and .zero_cost_guard == true
              ' health.json >/dev/null; then
                ok=1
                break
              fi
            fi
            sleep 3
          done
          test "${ok}" -eq 1
          curl -fsSI "${url}/" | head -n 1 | grep -Eq " 200( |$)"

      - name: Build non-secret summary
        working-directory: web-template
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          resources=json.loads(Path("p008-resources.json").read_text())
          health=json.loads(Path("health.json").read_text())
          summary={
            **resources,
            "worker_name":"p008-web-template",
            "preview_name":"develop",
            "preview_url":Path("preview-url.txt").read_text().strip(),
            "preview_health":health,
            "workflow_run_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "source_sha":"${{ github.sha }}",
          }
          Path("p008-cloudflare-summary.json").write_text(
            json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True))
          PY

      - name: Upload provisioning evidence
        uses: actions/upload-artifact@v4
        with:
          name: p008-cloudflare-free-preview-summary
          path: |
            web-template/p008-cloudflare-summary.json
            web-template/preview.json
            web-template/health.json
          if-no-files-found: error
