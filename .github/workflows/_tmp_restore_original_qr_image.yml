name: Restore original QR warehouse image

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/_tmp_restore_original_qr_image.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Download exact original image
        env:
          SOURCE_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-1194-8209-b1b4-942ce18a715c/raw?se=2026-09-27T13%3A52%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=d88479d5-e97a-58db-b3a6-ca51db236fef&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T05%3A53%3A00Z&ske=2026-09-28T05%3A53%3A00Z&sks=b&skv=2026-02-06&sig=AxnkLb7nbGtTLI6w0v%2BMiJnyDGtbvIm3cOohIIMiIR4%3D'
        run: |
          set -euo pipefail
          mkdir -p qr-search/test-images-rendered
          curl --fail --location --retry 3 "$SOURCE_URL" -o qr-search/test-images-rendered/warehouse_qr_sample_01.png

      - name: Verify original resolution and size
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import struct
          p = Path("qr-search/test-images-rendered/warehouse_qr_sample_01.png")
          data = p.read_bytes()
          assert len(data) == 3411195, f"unexpected size: {len(data)}"
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "not PNG"
          assert data[12:16] == b"IHDR", "missing IHDR"
          w, h = struct.unpack(">II", data[16:24])
          assert (w, h) == (1672, 941), f"unexpected dimensions: {(w, h)}"
          print(f"Verified exact source properties: {len(data)} bytes, {w}x{h}")
          PY

      - name: Update references and remove converted files
        run: |
          set -euo pipefail
          rm -f qr-search/test-images-rendered/warehouse_qr_sample_01.jpg
          rm -f qr-search/test-images-rendered/warehouse_qr_sample_02.jpg
          rm -f qr-search/test-images-rendered/warehouse_qr_sample_03.jpg
          python - <<'PY'
          from pathlib import Path
          p = Path("qr-search/test.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("warehouse_qr_sample_01.jpg", "warehouse_qr_sample_01.png")
          s = s.replace("warehouse_qr_sample_02.jpg", "warehouse_qr_sample_01.png")
          s = s.replace("warehouse_qr_sample_03.jpg", "warehouse_qr_sample_01.png")
          p.write_text(s, encoding="utf-8")
          PY
          cat > qr-search/test-images-rendered/manifest.json <<'JSON'
          [
            {
              "name": "warehouse_qr_sample_01.png",
              "path": "test-images-rendered/warehouse_qr_sample_01.png",
              "updatedAt": "2026-09-27T22:12:00+09:00",
              "source": "user_selected_final_image",
              "preserveOriginalBytes": true,
              "width": 1672,
              "height": 941
            }
          ]
          JSON
          rm -f .github/workflows/_tmp_restore_original_qr_image.yml

      - name: Commit exact original image to develop
        run: |
          set -euo pipefail
          git config user.name "OpenAI AutoAI"
          git config user.email "autoai@users.noreply.github.com"
          git add -A
          git commit -m "Restore original-resolution QR warehouse image"
          git push origin HEAD:develop
