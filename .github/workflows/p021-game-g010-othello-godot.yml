name: P021 GAME-G010 Othello Godot Redesign

on:
  push:
    branches: [develop]
    paths:
      - 'p021-game/sources/othello-godot/**'
      - 'p021-game/qa/othello-godot-responsive.js'
      - 'p021-game/index.html'
      - '.github/workflows/p021-game-g010-othello-godot.yml'
  workflow_dispatch:

concurrency:
  group: p021-game-g010-othello-godot-develop
  cancel-in-progress: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Bundle Noto Sans JP and license
        working-directory: p021-game/sources/othello-godot
        run: |
          mkdir -p fonts
          wget -q -O fonts/NotoSansJP.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/NotoSansJP%5Bwght%5D.ttf"
          wget -q -O fonts/OFL.txt "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/OFL.txt"
          test -s fonts/NotoSansJP.ttf
          test -s fonts/OFL.txt

      - name: Validate GAME-057 source contract
        run: |
          test -s p021-game/sources/othello-godot/project.godot
          test -s p021-game/sources/othello-godot/Main.gd
          test -s p021-game/sources/othello-godot/BoardView.gd
          grep -q 'GAME-057' p021-game/sources/othello-godot/Main.gd
          grep -q '_legal_moves' p021-game/sources/othello-godot/Main.gd
          grep -q '_choose_cpu_move' p021-game/sources/othello-godot/Main.gd

      - name: Import and parse Godot project
        working-directory: p021-game/sources/othello-godot
        run: |
          if ! godot --headless --editor --quit-after 4 > /tmp/godot-import.log 2>&1; then
            cat /tmp/godot-import.log
            exit 1
          fi
          cat /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-import.log; then
            echo "Godot script parse/import errors detected."
            exit 1
          fi

      - name: Export GAME-G010 for Web
        working-directory: p021-game/sources/othello-godot
        run: |
          rm -rf ../../games/othello
          mkdir -p ../../games/othello
          if ! godot --headless --export-release "Web" ../../games/othello/index.html > /tmp/godot-export.log 2>&1; then
            cat /tmp/godot-export.log
            exit 1
          fi
          cat /tmp/godot-export.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-export.log; then
            echo "Godot script errors detected during export."
            exit 1
          fi
          cp README.md ../../games/othello/README.md
          cp CREDITS.md ../../games/othello/CREDITS.md
          cp fonts/OFL.txt ../../games/othello/NotoSansJP-OFL.txt
          cat > ../../games/othello/build.json <<'JSON'
          {
            "game": "GAME-G010",
            "task": "GAME-057",
            "engine": "Godot 4.7.2",
            "renderer": "Compatibility",
            "thread_support": false,
            "quality_target": 89
          }
          JSON
          test -f ../../games/othello/index.html
          test -f ../../games/othello/index.wasm
          test -f ../../games/othello/index.pck
          test -f ../../games/othello/index.js

      - name: Commit exported Godot Web build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A p021-game/games/othello/
          if git diff --cached --quiet; then
            echo "No exported changes."
          else
            git commit -m "P021 GAME-057: publish Othello Godot Web"
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi

  browser-quality:
    needs: export-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve P021 locally
        run: |
          python3 -m http.server 8000 > /tmp/p021-g010-godot-http.log 2>&1 &
          echo $! > /tmp/p021-g010-godot-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/p021-game/games/othello/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/p021-g010-godot-http.log
          exit 1

      - name: Run URL-only and four-viewport quality gate
        run: node p021-game/qa/othello-godot-responsive.js

      - name: Commit QA evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p021-game/docs/qa/game-g010-godot-redesign/
          if git diff --cached --quiet; then
            echo "No QA evidence changes."
          else
            git commit -m "P021 GAME-057: record Othello Godot QA"
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi
