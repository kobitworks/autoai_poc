name: P021 Build Godot Web

on:
  push:
    branches: [develop]
    paths:
      - 'p021-game/sources/one-square-farm-godot/**'
      - '.github/workflows/p021-game-godot-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Export GAME-G001 for Web
        working-directory: p021-game/sources/one-square-farm-godot
        run: |
          mkdir -p ../../games/one-square-farm-godot
          godot --headless --editor --quit-after 2
          godot --headless --export-release "Web" ../../games/one-square-farm-godot/index.html
          test -f ../../games/one-square-farm-godot/index.html
          test -f ../../games/one-square-farm-godot/index.wasm
          test -f ../../games/one-square-farm-godot/index.pck
      - name: Commit exported Web build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p021-game/games/one-square-farm-godot/
          if git diff --cached --quiet; then
            echo "No exported changes."
          else
            git commit -m "P021: build GAME-G001 Godot Web export"
            git push origin HEAD:develop
          fi
