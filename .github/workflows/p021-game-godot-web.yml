name: P021 Build GAME-G001 Godot Web

on:
  push:
    branches: [develop]
    paths:
      - 'p021-game/sources/one-square-farm-godot/**'
      - '.github/workflows/p021-game-godot-web.yml'
  workflow_dispatch:

concurrency:
  group: p021-game-godot-web-develop
  cancel-in-progress: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Bundle Japanese font
        working-directory: p021-game/sources/one-square-farm-godot
        run: |
          mkdir -p fonts
          wget -q -O fonts/NotoSansJP.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/NotoSansJP%5Bwght%5D.ttf"
          test -s fonts/NotoSansJP.ttf
      - name: Bundle Kenney Tiny Farm CC0 assets
        working-directory: p021-game/sources/one-square-farm-godot
        run: |
          mkdir -p assets/kenney /tmp/kenney-tiny-farm
          wget -q -O /tmp/kenney-tiny-farm.zip "https://kenney.nl/media/pages/assets/tiny-farm/dfded1ae3e-1782913588/kenney_tiny-farm.zip"
          unzip -o /tmp/kenney-tiny-farm.zip -d /tmp/kenney-tiny-farm
          cp /tmp/kenney-tiny-farm/Tilemap/tilemap_packed.png assets/kenney/tiny_farm.png
          cp /tmp/kenney-tiny-farm/License.txt assets/kenney/License.txt
          test -s assets/kenney/tiny_farm.png
          test -s assets/kenney/License.txt
      - name: Export GAME-G001 for Web
        working-directory: p021-game/sources/one-square-farm-godot
        run: |
          mkdir -p ../../games/one-square-farm-godot-v4
          godot --headless --editor --quit-after 2
          godot --headless --export-release "Web" ../../games/one-square-farm-godot-v4/index.html
          test -f ../../games/one-square-farm-godot-v4/index.html
          test -f ../../games/one-square-farm-godot-v4/index.wasm
          test -f ../../games/one-square-farm-godot-v4/index.pck
      - name: Commit exported Web build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p021-game/games/one-square-farm-godot-v4/
          if git diff --cached --quiet; then
            echo "No exported changes."
          else
            git commit -m "P021: build Godot Web games"
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi
