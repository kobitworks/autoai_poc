name: P021 Build GAME-G001 Godot Web

on:
  push:
    branches: [develop]
    paths:
      - 'p021-game/sources/one-square-farm-godot/**'
      - '.github/workflows/p021-game-godot-web.yml'
  workflow_dispatch:

concurrency:
  group: p021-game-godot-web-develop
  cancel-in-progress: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Run GAME-G001 mobile UI contract tests
        run: sh p021-game/sources/one-square-farm-godot/tests/test_mobile_ui.sh
      - name: Bundle Japanese font
        working-directory: p021-game/sources/one-square-farm-godot
        run: |
          mkdir -p fonts
          wget -q -O fonts/NotoSansJP.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/NotoSansJP%5Bwght%5D.ttf"
          test -s fonts/NotoSansJP.ttf
      - name: Bundle Kenney Tiny Farm CC0 assets
        working-directory: p021-game/sources/one-square-farm-godot
        run: |
          mkdir -p assets/kenney /tmp/kenney-tiny-farm
          wget -q -O /tmp/kenney-tiny-farm.zip "https://kenney.nl/media/pages/assets/tiny-farm/dfded1ae3e-1782913588/kenney_tiny-farm.zip"
          unzip -o /tmp/kenney-tiny-farm.zip -d /tmp/kenney-tiny-farm
          cp /tmp/kenney-tiny-farm/Tilemap/tilemap_packed.png assets/kenney/tiny_farm.png
          cp /tmp/kenney-tiny-farm/License.txt assets/kenney/License.txt
          test -s assets/kenney/tiny_farm.png
          test -s assets/kenney/License.txt
      - name: Bundle Kenney Interface Sounds CC0 assets
        working-directory: p021-game/sources/one-square-farm-godot
        run: |
          mkdir -p audio assets/kenney /tmp/kenney-interface-sounds
          wget -q -O /tmp/kenney-interface-sounds.zip "https://kenney.nl/media/pages/assets/interface-sounds/fa43c1dd4d-1677589452/kenney_interface-sounds.zip"
          unzip -o /tmp/kenney-interface-sounds.zip -d /tmp/kenney-interface-sounds
          for file in select_001.ogg click_001.ogg click_002.ogg click_003.ogg confirmation_001.ogg confirmation_004.ogg error_001.ogg; do
            cp "/tmp/kenney-interface-sounds/Audio/$file" "audio/$file"
            test -s "audio/$file"
          done
          cp /tmp/kenney-interface-sounds/License.txt assets/kenney/interface-sounds-License.txt
          test -s assets/kenney/interface-sounds-License.txt
      - name: Validate GAME-G001 audio contract
        run: sh p021-game/sources/one-square-farm-godot/tests/test_audio_contract.sh
      - name: Validate GAME-G001 challenge and record contract
        run: sh p021-game/sources/one-square-farm-godot/tests/test_challenge_contract.sh
      - name: Export GAME-G001 for Web
        working-directory: p021-game/sources/one-square-farm-godot
        run: |
          mkdir -p ../../games/one-square-farm-godot-v5
          godot --headless --editor --quit-after 2
          godot --headless --export-release "Web" ../../games/one-square-farm-godot-v5/index.html
          test -f ../../games/one-square-farm-godot-v5/index.html
          test -f ../../games/one-square-farm-godot-v5/index.wasm
          test -f ../../games/one-square-farm-godot-v5/index.pck
      - name: Commit exported Web build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p021-game/games/one-square-farm-godot-v5/
          if git diff --cached --quiet; then
            echo "No exported changes."
          else
            git commit -m "P021: build GAME-G001 Godot Web v5"
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi

  browser-responsive:
    needs: export-web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exported GAME-G001 locally
        run: |
          python3 -m http.server 4173 --directory p021-game > /tmp/p021-game-http.log 2>&1 &
          echo $! > /tmp/p021-game-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/games/one-square-farm-godot-v5/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/p021-game-http.log
          exit 1
      - name: Run four-viewport browser QA
        run: node p021-game/sources/one-square-farm-godot/tests/test_responsive_browser.mjs
      - name: Commit responsive QA evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p021-game/docs/qa/game-g001-responsive/
          if git diff --cached --quiet; then
            echo "No QA evidence changes."
          else
            git commit -m "P021: record GAME-G001 responsive browser QA"
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi
