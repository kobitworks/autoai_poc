name: Validate P014 used-car API client

on:
  push:
    branches:
      - develop
    paths:
      - "used-car/api-client.js"
      - "used-car/api-client.test.cjs"
      - "used-car/data-adapter.js"
      - "used-car/data-adapter.test.cjs"
      - "used-car/index.html"
      - ".github/workflows/validate-p014-used-car-api-client.yml"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "used-car/api-client.js"
      - "used-car/api-client.test.cjs"
      - "used-car/data-adapter.js"
      - "used-car/data-adapter.test.cjs"
      - "used-car/index.html"
      - ".github/workflows/validate-p014-used-car-api-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-client-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run tests
        shell: bash
        run: node --test used-car/api-client.test.cjs used-car/data-adapter.test.cjs

      - name: Confirm PoC remains disconnected by default
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<script src="./api-client.js"></script>' used-car/index.html
          grep -q '<script src="./data-adapter.js"></script>' used-car/index.html
          grep -q "UsedCarData.createAdapter({mode:'mock'})" used-car/index.html
          ! grep -q "https://.*workers.dev" used-car/index.html
