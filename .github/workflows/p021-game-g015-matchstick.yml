name: P021 GAME-G015 Matchstick Godot Redesign

on:
  push:
    branches: [develop]
    paths:
      - 'p021-game/sources/matchstick-godot/**'
      - 'p021-game/games/matchstick/**'
      - 'p021-game/qa/matchstick-responsive.js'
      - '.github/workflows/p021-game-g015-matchstick.yml'
  workflow_dispatch:

concurrency:
  group: p021-game-g015-matchstick-godot-develop
  cancel-in-progress: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: RED/GREEN contract for GAME-062
        run: |
          test -s p021-game/sources/matchstick-godot/project.godot
          test -s p021-game/sources/matchstick-godot/Main.tscn
          test -s p021-game/sources/matchstick-godot/Main.gd
          test -s p021-game/sources/matchstick-godot/MatchstickLogic.gd
          test -s p021-game/sources/matchstick-godot/export_presets.cfg
          grep -q 'GAME-062' p021-game/sources/matchstick-godot/Main.gd
          grep -q 'one_match_only' p021-game/sources/matchstick-godot/MatchstickLogic.gd
          grep -q 'audio_enabled' p021-game/sources/matchstick-godot/Main.gd

      - name: Import and parse Godot project
        working-directory: p021-game/sources/matchstick-godot
        run: |
          if ! godot --headless --editor --quit-after 4 > /tmp/godot-import.log 2>&1; then
            cat /tmp/godot-import.log
            exit 1
          fi
          cat /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-import.log; then
            exit 1
          fi

      - name: Run logic smoke tests
        working-directory: p021-game/sources/matchstick-godot
        run: godot --headless --script tests/LogicSmoke.gd

      - name: Export GAME-G015 for Web
        working-directory: p021-game/sources/matchstick-godot
        run: |
          rm -rf ../../games/matchstick
          mkdir -p ../../games/matchstick
          godot --headless --export-release "Web" ../../games/matchstick/index.html
          cp README.md ../../games/matchstick/README.md
          cp CREDITS.md ../../games/matchstick/CREDITS.md
          cat > ../../games/matchstick/build.json <<'JSON'
          {
            "game": "GAME-G015",
            "task": "GAME-062",
            "engine": "Godot 4.7.2",
            "renderer": "Compatibility",
            "thread_support": false,
            "quality_target": 82
          }
          JSON
          test -s ../../games/matchstick/index.html
          test -s ../../games/matchstick/index.wasm
          test -s ../../games/matchstick/index.pck
          test -s ../../games/matchstick/index.js

      - name: Commit exported Godot Web build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A p021-game/games/matchstick/
          if git diff --cached --quiet; then
            echo "No exported changes."
          else
            git commit -m "P021 GAME-062: publish Matchstick Godot Web"
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi

  browser-quality:
    needs: export-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/p021-g015-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/p021-game/games/matchstick/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run four viewport QA
        run: node p021-game/qa/matchstick-responsive.js
