name: Build QR search sample images
# Baseline branch: this content-writing job must be triggered explicitly.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install pillow qrcode python-barcode cairosvg
      - run: python qr-search/tools/build_sample_images.py
      - name: Commit rendered samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898278+github-actions[bot]@users.noreply.github.com"
          git add qr-search/test-images-rendered
          if git diff --cached --quiet; then
            echo "No rendered changes"
          else
            git commit -m "Build static QR search sample images [skip ci]"
            git fetch origin develop
            git rebase origin/develop
            git push origin HEAD:develop
          fi
