name: Validate QR search sample images

on:
  push:
    branches: [develop]
    paths:
      - 'qr-search/test-images-rendered/**'
      - 'qr-search/test.html'
      - 'qr-search/tools/validate_sample_images.py'
      - '.github/workflows/build-qr-search-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opencv-python-headless
      - run: python qr-search/tools/validate_sample_images.py
