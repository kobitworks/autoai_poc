name: Build SKYBOUND Godot Web

on:
  push:
    branches:
      - main
    paths:
      - "skybound-flight/godot/**"
      - ".github/workflows/build-skybound-godot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --path skybound-flight/godot --import --quit

      - name: Export Web build
        run: |
          mkdir -p skybound-flight/godot-web
          godot --headless --path skybound-flight/godot --export-release "Web" ../godot-web/index.html

      - name: Commit Web build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skybound-flight/godot-web
          if git diff --cached --quiet; then
            echo "No build changes."
          else
            git commit -m "Build SKYBOUND Godot Web"
            git push
          fi
