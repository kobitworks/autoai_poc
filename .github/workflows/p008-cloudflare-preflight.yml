name: P008 Cloudflare preflight
# WEB-012 read-only readiness probe 2026-09-30

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/p008-cloudflare-preflight.yml"
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/p008-cloudflare-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is not configured"
              missing=1
            fi
          done
          test "${missing}" -eq 0

      - name: Verify Cloudflare account API token
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")"
          echo "${response}" | jq -e '.success == true and .result.status == "active"' >/dev/null

      - name: Verify Cloudflare account access
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")"
          echo "${response}" | jq -e '.success == true' >/dev/null

      - name: Check R2 subscription readiness
        id: r2
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets?per_page=1" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")"

          if [ "$code" = "403" ] && jq -e '.errors[]? | select(.code == 10042)' "$body" >/dev/null; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "R2_ENABLED=false"
            exit 0
          fi

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Unexpected R2 readiness response: HTTP $code"
            jq -c '{success,errors}' "$body" || true
            exit 1
          fi

          jq -e '.success == true' "$body" >/dev/null
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "R2_ENABLED=true"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## P008 Cloudflare preflight"
            echo
            echo "- account token: active"
            echo "- account access: ok"
            echo "- R2 enabled: ${{ steps.r2.outputs.enabled }}"
            echo "- resource changes: none"
          } >> "$GITHUB_STEP_SUMMARY"
