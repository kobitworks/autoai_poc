<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Biblio PoC - Legacy UI</title>
<style>
:root{
  --main:#7FC7D9;--base:#DCF2F1;--accent:#365486;--sub:#0F1035;--option:#6fc7dd;
  --ink:#3b3b3b;--link:#00008a;--border:#ccc;--paper1:#faf4e1;--paper2:#fffdf8;
  --white:#fff;--danger:#dc3545;--warn:#fff3cd;--ok:#28a745;
  --head-top:70px;--head-sub:30px;--title:30px;--banner:54px;--bottom:64px;
}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:"Yu Gothic Medium","游ゴシック Medium",YuGothic,"ヒラギノ角ゴ Pro W3",sans-serif;color:var(--ink);background:color-mix(in srgb,var(--base) 50%,white)}
button{font:inherit}.app-header{position:fixed;inset:0 0 auto 0;height:100px;z-index:30;background:var(--base);box-shadow:0 1px 4px #0002}
.head-top{height:70px;padding:5px 10px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px;font-size:25px;font-weight:800;color:var(--sub)}.logo-mark{width:46px;height:46px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--main));color:white;display:grid;place-items:center;font-family:Georgia,serif;font-size:30px;box-shadow:2px 2px 5px #0003}.mode{display:flex;align-items:center;gap:9px}.book-mini{width:42px;height:52px;border:2px solid var(--accent);background:linear-gradient(160deg,#fff8dc,#e6d6aa);border-radius:3px 7px 7px 3px;display:grid;place-items:center;font-size:20px}.mock{font-size:11px;font-weight:700;background:#fff;border:1px solid var(--accent);border-radius:4px;padding:3px 6px;color:var(--accent)}
.subnav{height:30px;background:var(--option);display:flex;align-items:center;gap:4px;padding:0 8px;overflow-x:auto;white-space:nowrap}.subnav button{border:0;background:transparent;color:var(--link);font-weight:700;padding:4px 9px;border-bottom:3px solid transparent}.subnav button.active{border-bottom-color:#004797;color:#004797}
.page-title{position:fixed;top:100px;left:0;right:0;height:30px;z-index:25;background:color-mix(in srgb,var(--main) 50%,white);display:flex;align-items:center;padding:0 10px;font-weight:800;color:color-mix(in srgb,var(--accent) 50%,black);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.main{position:fixed;top:130px;left:0;right:0;bottom:118px;overflow:auto;padding:8px;background:color-mix(in srgb,var(--base) 50%,white)}
.paper{position:relative;width:min(97%,920px);margin:5px auto;padding:15px;background:linear-gradient(to right,var(--paper1),var(--paper2));border-right:2px solid var(--border);box-shadow:8px 8px 16px #0003;border-radius:8px}
.paper:after{content:"";position:absolute;right:-5px;top:0;width:10px;height:100%;background:linear-gradient(to right,#0000000d,transparent);pointer-events:none}
.panel{background:#fff;border:1px solid #dfe6e7;border-radius:7px;padding:12px;margin:10px 0;box-shadow:2px 2px 5px #0001}.muted{color:#666;font-size:.9em}.notice{padding:10px;border:1px solid #c4d9de;background:#f6feff;border-radius:6px}.notice.warn{background:#fff8e1;border-color:#e8c96d}.notice.danger{background:#fff0f0;border-color:#e3a1a1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;padding:7px 13px;background:var(--accent);color:white;border:1px solid color-mix(in srgb,var(--accent) 50%,black);border-radius:4px;font-weight:700;cursor:pointer}.btn:hover,.btn:focus-visible{background:white;color:#004797}.btn.secondary{background:#fff;color:var(--accent)}.btn.danger{background:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}
.book-container{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:0}.book-card{width:112px;height:150px;background:#fafafa;border:1px solid var(--border);box-shadow:2px 2px 5px #0002;margin:7px;position:relative;cursor:pointer}.book-card:hover{transform:translateY(-2px)}.cover{width:100%;height:100%;padding:8px;background:linear-gradient(160deg,#f5ead0,#c9dee6);display:flex;flex-direction:column;justify-content:space-between;border-left:8px solid var(--accent)}.cover.c2{background:linear-gradient(160deg,#dceff5,#bfdacb);border-left-color:#517f70}.cover.c3{background:linear-gradient(160deg,#eee1d2,#d8b7aa);border-left-color:#885d4d}.cover-title{font-weight:800;font-size:13px;line-height:1.35;color:#25333c}.cover-region{font-size:11px;color:#555}.status{position:absolute;top:4px;right:4px;background:white;border:1px solid var(--accent);border-radius:3px;padding:1px 4px;font-size:9px;font-weight:800}.selected{position:absolute;bottom:4px;right:4px;background:var(--ok);color:white;border-radius:10px;padding:2px 5px;font-size:9px}
.fact{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dotted #bbb}.story{font-size:17px;line-height:1.9}.map{height:42vh;min-height:260px;border:1px solid #aaa;background:radial-gradient(circle at 62% 44%,#d33 0 8px,transparent 9px),linear-gradient(35deg,#dbeacb 25%,transparent 25%),linear-gradient(-35deg,#d8edf3 25%,transparent 25%),#eef6e8;background-size:auto,44px 44px,44px 44px;position:relative}.map-label{position:absolute;left:10px;bottom:10px;background:#fff;padding:8px;border:1px solid #aaa;border-radius:4px}
.ops-grid{display:grid;grid-template-columns:280px 1fr;gap:12px}.ops-list button{display:block;width:100%;text-align:left;padding:9px;margin:5px 0;background:white;border:1px solid #bbb;border-radius:4px}
.banner{position:fixed;left:0;right:0;bottom:64px;height:54px;background:var(--base);z-index:30;display:grid;place-items:center;border-top:1px solid #a9c7c9}.adbox{width:min(320px,92vw);height:50px;border:1px dashed #799;background:#f8ffff;display:grid;place-items:center;color:#607d80;font-size:12px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;height:64px;background:var(--base);z-index:31;border-top:1px solid #b6d7d7;display:flex;justify-content:space-around;align-items:center}.bottomnav button{width:20%;height:100%;border:0;background:transparent;color:var(--link);font-weight:700;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.bottomnav button.current{text-decoration:underline;color:#004797}.ico{font-size:24px}
.reviewbar{position:fixed;right:8px;top:137px;z-index:40}.reviewbar details{background:#fff;border:1px solid #aaa;border-radius:5px;box-shadow:0 2px 8px #0003}.reviewbar summary{cursor:pointer;padding:5px 8px;font-size:11px;color:#555}.review-buttons{max-width:260px;padding:6px;display:flex;flex-wrap:wrap;gap:4px}.review-buttons button{font-size:10px;padding:4px;background:#eef6f8;border:1px solid #9bb;color:#345;border-radius:3px}
dialog{border:1px solid #789;border-radius:6px;padding:0;width:min(440px,calc(100% - 30px));box-shadow:0 15px 45px #0006}dialog::backdrop{background:#0006}.dlg{padding:16px}
.dev{font-size:11px;color:#687577;border-top:1px dotted #aaa;margin-top:14px;padding-top:8px}
@media(min-width:768px){.app-header{height:140px}.desktop-nav{display:flex;height:40px;background:color-mix(in srgb,var(--main) 50%,white);align-items:center;gap:2px;padding:0 10px}.desktop-nav button{background:transparent;border:0;border-right:1px solid #777;padding:0 12px;font-size:17px;font-weight:800;color:var(--link)}.page-title{top:140px}.main{top:170px;bottom:64px}.banner{bottom:0;height:64px}.bottomnav{display:none}.book-card{width:125px;height:165px}.ops-grid{grid-template-columns:340px 1fr}}
@media(max-width:767px){.desktop-nav{display:none}.ops-grid{grid-template-columns:1fr}.paper{width:100%;padding:12px 10px}.reviewbar{top:134px}.map{height:46vh}}
</style>
</head>
<body>
<header class="app-header">
  <div class="head-top"><div class="logo"><span class="logo-mark">B</span><span>Biblio</span></div><div class="mode"><span class="mock">PoC / MOCK</span><div class="book-mini" aria-label="選択中Book">📖</div></div></div>
  <nav class="desktop-nav"><button onclick="go('U04')">Map</button><button onclick="go('U01')">List</button><button onclick="go('U01')">Book</button><button onclick="go('U09')">Info</button><button onclick="go('O01')">Config</button></nav>
  <nav class="subnav" id="subnav"></nav>
</header>
<div class="page-title" id="pageTitle"></div>
<main class="main" id="app"></main>
<div class="reviewbar"><details><summary>PoC画面ジャンプ</summary><div class="review-buttons" id="jump"></div></details></div>
<footer class="banner"><div class="adbox">Biblio Banner Area / 320×50 mock</div></footer>
<nav class="bottomnav" aria-label="メインメニュー">
  <button data-menu="map" onclick="go('U04')"><span class="ico">📍</span><span>Map</span></button>
  <button data-menu="list" onclick="go('U01')"><span class="ico">☷</span><span>List</span></button>
  <button data-menu="book" onclick="go('U01')"><span class="ico">📚</span><span>Book</span></button>
  <button data-menu="info" onclick="go('U09')"><span class="ico">ℹ️</span><span>Info</span></button>
  <button data-menu="config" onclick="go('O01')"><span class="ico">⚙️</span><span>Config</span></button>
</nav>
<dialog id="confirm"><div class="dlg"><h3 id="confirmTitle">確認</h3><p id="confirmText"></p><div class="actions"><button class="btn secondary" id="cancelDlg">キャンセル</button><button class="btn" id="okDlg">実行</button></div></div></dialog>
<script>
const state={screen:'U01',book:'walk-shibuya',locationResult:null,progress:true,complete:false,selectedNext:null,books:[
 {key:'walk-shibuya',title:'街角ミステリー',region:'渋谷',time:'45分',desc:'街を歩きながら手がかりを集める短編Book。',available:true,pub:'LIVE',cls:''},
 {key:'river-story',title:'川辺の記憶',region:'清澄白河',time:'35分',desc:'水辺の風景をめぐる物語。',available:true,pub:'TEST',cls:'c2'},
 {key:'old-town',title:'古い商店街の手紙',region:'谷中',time:'50分',desc:'商店街に残された手紙を追うBook。',available:false,pub:'STOP',cls:'c3'}
]};
const labels={U01:'Book',U02:'Book Detail',U03:'Story',U04:'Map',U05:'Location Check',U06:'Safety',U08:'Book Complete',U09:'Next Book',U10:'Book Select',O01:'Publication'};
const app=document.getElementById('app'), jump=document.getElementById('jump'), subnav=document.getElementById('subnav'), title=document.getElementById('pageTitle');
function b(){return state.books.find(x=>x.key===state.book)||state.books[0]}
function go(s){state.screen=s;history.replaceState({s},'', '#'+s);render()}
function btn(t,a,c=''){return '<button class="btn '+c+'" onclick="'+a+'">'+t+'</button>'}
function page(body){return '<div class="paper">'+body+'<div class="dev">画面・遷移確認用PoCです。公開・進行・位置到達・Completeは本番確定処理ではありません。</div></div>'}
function renderNav(){
 const map={U01:['Book List','My Biblio'],U02:['Book Detail'],U03:['Story','Progress'],U04:['Map','Spot'],U05:['Map','Location'],U06:['Safety'],U08:['Complete'],U09:['Next Book'],U10:['Select'],O01:['Publication','Version']};
 subnav.innerHTML=(map[state.screen]||[]).map((x,i)=>'<button class="'+(i===0?'active':'')+'">'+x+'</button>').join('');
 title.textContent=labels[state.screen]||'Biblio';
 jump.innerHTML=Object.keys(labels).map(k=>'<button onclick="go(\''+k+'\')">'+k+' '+labels[k]+'</button>').join('');
 document.querySelectorAll('.bottomnav button').forEach(x=>x.classList.remove('current'));
 const menu=state.screen==='U04'||state.screen==='U05'||state.screen==='U06'?'map':state.screen==='O01'?'config':state.screen==='U09'||state.screen==='U10'?'info':'book';
 const el=document.querySelector('.bottomnav [data-menu="'+menu+'"]');if(el)el.classList.add('current');
}
function cover(x,idx){return '<div class="book-card" tabindex="0" role="button" onclick="state.book=\''+x.key+'\';go(\'U02\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){this.click()}"><div class="cover '+x.cls+'"><div class="cover-title">'+x.title+'</div><div class="cover-region">'+x.region+' / '+x.time+'</div></div><span class="status">'+x.pub+'</span>'+(x.key===state.book?'<span class="selected">選択中</span>':'')+'</div>'}
function render(){
 renderNav();const book=b();
 if(state.screen==='U01'){
  app.innerHTML=page((state.progress?'<div class="panel"><strong>つづきから</strong><p>'+book.title+' — Scene 2まで進行中</p>'+btn('つづきから',"go('U03')")+'</div>':'')+'<h3>Book一覧</h3><div class="book-container">'+state.books.map(cover).join('')+'</div><p class="muted">旧BiblioのBook表紙一覧を基準にしたPoC表示です。</p>');
 }else if(state.screen==='U02'){
  app.innerHTML=page('<h2>'+book.title+'</h2><p>'+book.desc+'</p><div class="panel"><div class="fact"><span>地域</span><strong>'+book.region+'</strong></div><div class="fact"><span>想定時間</span><strong>'+book.time+'</strong></div><div class="fact"><span>位置情報</span><strong>必要な場面だけ</strong></div><div class="fact"><span>公開状態</span><strong>'+(book.available?'開始可能':'現在開始不可')+'</strong></div></div><div class="actions">'+btn('Book一覧へ',"go('U01')",'secondary')+(book.available?btn('このBookを始める',"go('U03')"):'<button class="btn" disabled>現在開始できません</button>')+'</div>');
 }else if(state.screen==='U03'){
  app.innerHTML=page('<p class="muted">'+book.title+' / Chapter 1 / Scene 2</p><h2>交差点の小さな違和感</h2><div class="story"><p>店先の古い時計は、街の時間から少しだけ遅れていた。</p><p>次の手がかりは、ここから数分歩いた「青い壁の広場」にあるらしい。</p></div><div class="notice warn"><strong>移動前に確認</strong><br>歩きながら画面を見続けず、安全な場所で操作してください。</div><div class="actions">'+btn('目的地を確認する',"go('U04')")+btn('中断してBookへ',"go('U01')",'secondary')+'</div>');
 }else if(state.screen==='U04'){
  app.innerHTML=page('<h2>青い壁の広場</h2><div class="notice warn">移動中は画面を見続けず、安全な場所で操作してください。</div><div class="map" role="img" aria-label="青い壁の広場の位置を示す簡易地図"><div class="map-label"><strong>青い壁の広場</strong><br>現在地から約350m（PoC）</div></div><p>地図を見られない場合：大通りを北へ進み、青い壁の広場を目印にしてください。</p><div class="actions">'+btn('到着確認へ',"go('U05')")+btn('Storyへ',"go('U03')",'secondary')+'</div>');
 }else if(state.screen==='U05'){
  app.innerHTML=page('<h2>到着を確認</h2><div class="notice"><strong>位置情報を使う理由</strong><br>この目的地に到着したか確認するため、今だけ端末の位置情報を利用します。</div><p>位置情報は到着確認に必要なときだけ取得します。PoCでは実位置情報は取得しません。</p><div class="actions">'+btn('到着として確認',"locationMock('ARRIVED')")+btn('まだ到着していない',"locationMock('NOT_ARRIVED')",'secondary')+btn('判定不能を試す',"locationMock('INDETERMINATE')",'secondary')+'</div>');
 }else if(state.screen==='U06'){
  app.innerHTML=page('<h2>安全に続けるために</h2><div class="notice danger"><strong>'+(state.locationResult==='NOT_ARRIVED'?'まだ目的地への到着を確認できませんでした。':'位置情報を確認できませんでした。')+'</strong><br>失敗・拒否・不明を到着成功として扱いません。</div><div class="actions">'+btn('Mapへ',"go('U04')")+btn('もう一度確認',"go('U05')",'secondary')+btn('代替進行',"alternativeProgress()",'secondary')+btn('中断',"go('U01')",'secondary')+'</div>');
 }else if(state.screen==='U08'){
  app.innerHTML=page('<h1>Book Complete</h1><p><strong>'+book.title+'</strong> を完走しました。</p><div class="panel">Completeは次Book選択や広告表示とは独立して成立します。</div><div class="actions">'+btn('次のBookを見る',"go('U09')")+btn('Book一覧へ',"go('U01')",'secondary')+'</div>');
 }else if(state.screen==='U09'){
  const next=state.books.filter(x=>x.key!==book.key&&x.available);
  app.innerHTML=page('<h2>次のBook</h2><div class="book-container">'+next.map(cover).join('')+'</div><p class="muted">候補表示だけでは次Bookは確定しません。</p>');
 }else if(state.screen==='U10'){
  const x=state.books.find(v=>v.key===state.selectedNext)||state.books.find(v=>v.key!==book.key&&v.available);
  app.innerHTML=page('<h2>次に読むBook</h2><div class="panel"><strong>'+x.title+'</strong><p>'+x.region+' / '+x.time+'</p><p>'+x.desc+'</p></div><div class="actions">'+btn('このBookを選ぶ',"selectNext('"+x.key+"')")+btn('候補へ',"go('U09')",'secondary')+'</div>');
 }else if(state.screen==='O01'){
  app.innerHTML=page('<h2>公開管理</h2><p>一般利用画面とは分離した運用PoCです。</p><div class="ops-grid"><div class="panel ops-list">'+state.books.map(x=>'<button onclick="state.book=\''+x.key+'\';render()"><strong>'+x.title+'</strong><br><small>'+x.pub+'</small></button>').join('')+'</div><div class="panel"><h3>'+book.title+'</h3><div class="fact"><span>対象版</span><strong>v2026.10-poc</strong></div><div class="fact"><span>公開状態</span><strong>'+book.pub+'</strong></div><div class="actions">'+btn('Test公開',"opsConfirm('TEST')",'secondary')+btn('本公開',"opsConfirm('LIVE')")+btn('公開停止',"opsConfirm('STOP')",'danger')+btn('版を差し替え',"opsConfirm('REPLACE')",'secondary')+'</div></div></div>');
 }
}
function locationMock(r){state.locationResult=r;if(r==='ARRIVED'){state.complete=true;go('U08')}else go('U06')}
function alternativeProgress(){state.locationResult='ALTERNATIVE';alert('PoC: 代替進行でStoryへ戻ります。');go('U03')}
function selectNext(key){state.book=key;state.selectedNext=null;go('U02')}
let pending=null;const dlg=document.getElementById('confirm');
function opsConfirm(a){pending=a;document.getElementById('confirmText').textContent=a==='LIVE'?'この版を本公開します。よろしいですか？':a==='STOP'?'このBookの公開を停止します。よろしいですか？':a==='TEST'?'この版をTest公開します。よろしいですか？':'公開対象の版を差し替えます。よろしいですか？';dlg.showModal()}
document.getElementById('cancelDlg').onclick=()=>{pending=null;dlg.close()}
document.getElementById('okDlg').onclick=()=>{if(pending&&pending!=='REPLACE')b().pub=pending;pending=null;dlg.close();render()}
window.addEventListener('popstate',e=>{if(e.state?.s){state.screen=e.state.s;render()}})
if(location.hash&&labels[location.hash.slice(1)])state.screen=location.hash.slice(1);
render();
</script>
</body>
</html>
