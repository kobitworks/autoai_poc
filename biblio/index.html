 const byEmail=new Map(DEFAULT_USER_DIRECTORY.map(x=>[x.email,{...x}]));

const LOCATION_RULES=Object.freeze({arrivalRadiusM:60,maxAccuracyM:50,maxAgeMs:30000,futureSkewMs:5000,timeoutMs:10000,minRetryMs:3000,maxAttempts:3});
function resetLocationCheck(){
 const permission=state.location?.permission||'unknown';
 state.location={status:'idle',result:null,reason:'',permission,message:'',attempts:0,lastAttemptAt:0};
 state.locationResult=null;state.locationReached=false;
}
async function queryLocationPermission(){
 if(state.screen!=='U05'||state.location.status!=='idle'||state.location.permission!=='unknown')return;
 if(!navigator.permissions||!navigator.permissions.query){state.location.permission='unsupported';return}
 try{
  const p=await navigator.permissions.query({name:'geolocation'});
  state.location.permission=p.state;
  p.onchange=()=>{state.location.permission=p.state;if(state.screen==='U05')render()};
  if(state.screen==='U05')render();
 }catch(e){state.location.permission='unsupported';}
}
function checkCurrentPosition(){
 const loc=state.location,now=Date.now();
 if(loc.status==='checking')return;
 if(loc.lastAttemptAt&&now-loc.lastAttemptAt<LOCATION_RULES.minRetryMs){loc.message='連続確認を避けるため、少し待ってからもう一度お試しください。';render();return}
 if(loc.attempts>=LOCATION_RULES.maxAttempts){applyLocationResult('LOCATION_UNAVAILABLE','TECHNICAL_RETRY_LIMIT','この画面での技術的な再確認上限に達しました。安全な進め方を確認してください。');return}
 if(!navigator.geolocation){applyLocationResult('LOCATION_UNAVAILABLE','GEOLOCATION_UNSUPPORTED','このブラウザでは位置情報を利用できません。');return}
 loc.status='checking';loc.result=null;loc.reason='';loc.message='到着を確認しています…';loc.attempts+=1;loc.lastAttemptAt=now;render();
 navigator.geolocation.getCurrentPosition(onLocationSuccess,onLocationError,{enableHighAccuracy:true,maximumAge:0,timeout:LOCATION_RULES.timeoutMs});
}
async function onLocationSuccess(position){
 if(state.screen!=='U05')return;
 const sample={lat:Number(position.coords.latitude),lon:Number(position.coords.longitude),accuracy:Number(position.coords.accuracy),capturedAt:Number(position.timestamp)};
 if(serverEnabled()&&state.server.progressId){try{const res=await apiRequest('/api/v1/progress/'+encodeURIComponent(state.server.progressId)+'/location-checks',{method:'POST',idempotencyKey:'location:'+state.server.progressId+':'+state.location.attempts,body:{latitude:sample.lat,longitude:sample.lon,accuracy_m:sample.accuracy,position_age_ms:Math.max(0,Date.now()-sample.capturedAt)}});applyLocationResult(res.result,res.reason,res.result==='ARRIVED'?'PHP APIで到着を確認しました。':'PHP APIの判定結果を反映しました。');return}catch(e){applyLocationResult('LOCATION_UNAVAILABLE','API_ERROR','位置判定APIを利用できませんでした。');return}}
 const result=mockAuthoritativeLocationApi(sample);
 applyLocationResult(result.result,result.reason,result.message);
}
function onLocationError(error){
 if(state.screen!=='U05')return;
 if(error&&error.code===1){state.location.permission='denied';applyLocationResult('LOCATION_UNAVAILABLE','PERMISSION_DENIED','位置情報の利用が拒否されています。ブラウザまたは端末の設定を確認するか、安全な代替手段を選んでください。');return}
 if(error&&error.code===2){applyLocationResult('LOCATION_UNAVAILABLE','POSITION_UNAVAILABLE','現在地を取得できませんでした。安全な場所で再確認するか、代替手段を選んでください。');return}
 if(error&&error.code===3){applyLocationResult('LOCATION_UNAVAILABLE','TIMEOUT','10秒以内に現在地を取得できませんでした。安全な場所で再確認してください。');return}
 applyLocationResult('LOCATION_UNAVAILABLE','GEOLOCATION_ERROR','位置情報を利用できませんでした。');
}
function mockAuthoritativeLocationApi(sample){
 // PoCではここをServer権威のlocation-check API境界として模擬する。本番ではClientで到着を確定しない。
 if(!Number.isFinite(sample.lat)||!Number.isFinite(sample.lon)||!Number.isFinite(sample.accuracy)||!Number.isFinite(sample.capturedAt))return{result:'INDETERMINATE',reason:'POSITION_INVALID',message:'取得した位置情報を安全に判定できませんでした。'};
 const age=Date.now()-sample.capturedAt;
 if(sample.accuracy>LOCATION_RULES.maxAccuracyM)return{result:'INDETERMINATE',reason:'POSITION_NOT_RELIABLE',message:'位置の精度が十分でないため、到着を確定しません。'};
 if(age>LOCATION_RULES.maxAgeMs)return{result:'INDETERMINATE',reason:'POSITION_STALE',message:'位置情報が古いため、到着を確定しません。'};
 if(age < -LOCATION_RULES.futureSkewMs)return{result:'INDETERMINATE',reason:'POSITION_CLOCK_SKEW',message:'端末時刻との差が大きいため、到着を確定しません。'};
 const d=haversineMeters(sample.lat,sample.lon,MAP_TARGET[0],MAP_TARGET[1]),a=sample.accuracy,r=LOCATION_RULES.arrivalRadiusM;
 if(d+a<=r)return{result:'ARRIVED',reason:'ARRIVAL_CONFIRMED',message:'位置の精度を含めても到着圏内であることを確認しました。'};
 if(d-a>r)return{result:'NOT_ARRIVED',reason:'OUTSIDE_ARRIVAL_RADIUS',message:'現在地は到着圏外と判定されました。地図で目的地を確認してください。'};
 return{result:'INDETERMINATE',reason:'BOUNDARY_UNCERTAIN',message:'位置の精度範囲が到着境界と重なるため、到着を確定しません。'};
}
function haversineMeters(lat1,lon1,lat2,lon2){
 const toRad=x=>x*Math.PI/180,R=6371000,p1=toRad(lat1),p2=toRad(lat2),dp=toRad(lat2-lat1),dl=toRad(lon2-lon1);
 const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
 return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}
function applyLocationResult(result,reason,message){

}

function previewNextBook(key){const completedBookKey=state.completion.record?.bookKey||state.book;const x=state.books.find(v=>v.key===key&&v.key!==completedBookKey&&v.available);if(!x)return;state.nextBookNotice='';state.selectedNext=key;go('U10')}
async function confirmNextBookSelection(){const key=state.selectedNext,completedBookKey=state.completion.record?.bookKey||state.book,x=state.books.find(v=>v.key===key&&v.key!==completedBookKey&&v.available);if(!x){go('U09');return}if(serverEnabled()&&state.server.progressId){try{await apiRequest('/api/v1/progress/'+encodeURIComponent(state.server.progressId)+'/next-book-selection',{method:'POST',idempotencyKey:'next:'+state.server.progressId,body:{book_key:key}})}catch(e){state.nextBookNotice='次Book選択を確定できませんでした。通信状態を確認してもう一度お試しください。';go('U09');return}}state.nextBookNotice='';state.book=key;state.selectedNext=null;state.story=null;state.storyAdvance={status:'idle',error:'',notice:'',mode:'success',lastRequestKey:''};state.start={status:'idle',error:'',mode:'success'};state.locationResult=null;state.locationReached=false;state.location={status:'idle',result:null,reason:'',permission:state.location.permission||'unknown',message:'',attempts:0,lastAttemptAt:0};go('U02')}
function selectNext(key){previewNextBook(key)}
let pending=null;const dlg=document.getElementById('confirm');
function opsConfirm(a){if(!hasOpsRole())return;pending={action:a,bookKey:state.book};document.getElementById('confirmText').textContent=a==='LIVE'?'この版を本公開します。よろしいですか？':a==='STOP'?'このBookの公開を停止します。よろしいですか？':a==='TEST'?'この版をTest公開します。よろしいですか？':'公開対象の版を差し替えます。よろしいですか？';dlg.showModal()}
async function mockAuthoritativePublishApi(bookKey,action){if(!hasOpsRole())return{ok:false,error:'FORBIDDEN'};const book=state.books.find(x=>x.key===bookKey);if(!book)return{ok:false,error:'BOOK_NOT_FOUND'};if(serverEnabled()){const res=await apiRequest('/api/v1/ops/books/'+encodeURIComponent(bookKey)+'/publication',{method:'POST',idempotencyKey:'publish:'+bookKey+':'+action,body:{action,version_key:action==='REPLACE'?'v2026.10-poc-r2':state.ops.version}});return{ok:true,bookKey,action,version:res.version_key||state.ops.version,pub:res.publication_state||book.pub}}if(action==='REPLACE')return{ok:true,bookKey,action,version:'v2026.10-poc-r2',pub:book.pub};if(!['TEST','LIVE','STOP'].includes(action))return{ok:false,error:'INVALID_ACTION'};return{ok:true,bookKey,action,version:state.ops.version,pub:action}}
function executeOpsAction(req){state.ops.status='saving';state.ops.error='';state.ops.result='';render();mockAuthoritativePublishApi(req.bookKey,req.action).then(res=>{if(!res.ok)throw new Error(res.error||'publish failed');const book=state.books.find(x=>x.key===res.bookKey);if(!book)throw new Error('book missing');if(res.action==='REPLACE')state.ops.version=res.version;else book.pub=res.pub;state.ops.status='idle';state.ops.result=(res.action==='REPLACE'?'版差し替え':'公開状態変更')+'が完了しました。 '+book.title+' / '+(res.action==='REPLACE'?res.version:res.pub);render()}).catch(()=>{state.ops.status='idle';state.ops.error='公開操作を確定できませんでした。権限または通信状態を確認してください。';render()})}
document.getElementById('cancelDlg').onclick=()=>{pending=null;dlg.close()}
dlg.addEventListener('cancel',()=>{pending=null})
document.getElementById('okDlg').onclick=()=>{const req=pending;pending=null;dlg.close();if(req)executeOpsAction(req)}

if(restored)state.screen=requested&&requested!=='LOGIN'?((requested==='O01'||requested==='A01')&&!hasAdminRole()?'U04':requested):'U04';
