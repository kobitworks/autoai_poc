 {key:'old-town',title:'古い商店街の手紙',region:'谷中',time:'50分',desc:'商店街に残された手紙を追うBook。',safety:'通行の妨げにならない場所で立ち止まって操作してください。',available:false,unavailableReason:'現在公開を停止しています。',pub:'STOP',cls:'c3'}
],progressRecords:[

 const menu=state.screen==='U04'||state.screen==='U05'||state.screen==='U06'?'map':state.screen==='O01'?'config':state.screen==='U09'||state.screen==='U10'?'info':'book';
 const el=document.querySelector('.bottomnav [data-menu="'+menu+'"]');if(el)el.classList.add('current');
 const loggedIn=state.auth.status==='logged_in';sessionChip.hidden=isLogin||!loggedIn;sessionChip.innerHTML=loggedIn?'Google mock: '+state.auth.user.email+(state.auth.restored?' / 復元済み':'')+' <button onclick="logoutMock()">ログアウト</button>':'';
}
function cover(x,idx){const p=latestProgress(x.key),availability=!x.available?'利用不可':p?'進行中':'利用可';return '<div class="book-card" tabindex="0" role="button" aria-label="'+x.title+' '+availability+'" onclick="state.book=\''+x.key+'\';go(\'U02\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){this.click()}"><div class="cover '+x.cls+'"><div class="cover-title">'+x.title+'</div><div class="cover-region">'+x.region+' / '+x.time+'</div></div><span class="status">'+availability+'</span>'+(x.key===state.book?'<span class="selected">選択中</span>':'')+'</div>'}
function render(){
 renderNav();const book=b();
 if(state.screen==='LOGIN'){
  app.innerHTML='<div class="login-screen"><div class="login-logo"><span class="login-logo-book">▯</span><span>Biblio</span></div><div class="login-copy"><p>ゲームを遊ぶにはGoogleアカウントが必要です。</p><p>スマートフォンまたはタブレットの使用を推奨しております。</p></div><button class="google-login" onclick="loginMock(\'success\')" '+(state.auth.status==='authenticating'?'disabled':'')+'><span class="gmark">G</span><span>'+(state.auth.status==='authenticating'?'Google 認証中…':'Google でログイン')+'</span></button>'+(state.auth.error?'<div class="login-error" role="alert">'+state.auth.error+'</div>':'')+'<div class="login-note">PoC：Google OAuthの資格情報は使用せず、認証結果のみmockします</div>'+(reviewMode?'<div class="login-dev-actions"><button class="btn secondary" onclick="loginMock(\'error\')">認証エラーを試す</button><button class="btn secondary" onclick="clearSessionMock()">保存セッションを消去</button></div>':'')+'</div>';
 }else if(state.screen==='U01'){
  const resume=latestResumeCandidate();
  app.innerHTML=page((state.resumeNotice?'<div class="notice warn">'+state.resumeNotice+'</div>':'')+(resume?'<div class="panel"><strong>つづきから</strong><p>'+resume.book.title+' — Chapter '+resume.progress.chapter+' / Scene '+resume.progress.scene+'</p><p class="muted">'+resume.progress.sceneTitle+'</p>'+btn('つづきから',"resumeBook('"+resume.book.key+"')")+'</div>':'<div class="panel muted">再開できる進行中Bookはありません。</div>')+'<h3>Book一覧</h3><div class="book-container">'+state.books.map(cover).join('')+'</div><p class="muted">旧BiblioのBook表紙一覧を維持し、利用可能・進行中・利用不可を表示しています。</p>'+(reviewMode?'<div class="panel"><strong>U07 Resume Resolver 確認</strong><p class="muted">U07は独立画面を表示せず、最新の再開可能Sceneを解決してU03へreplaceします。</p><div class="actions">'+btn('再開データあり',"setResumeMock(true)",'secondary')+btn('再開データなし',"setResumeMock(false)",'secondary')+'</div></div>':''));
 }else if(state.screen==='U02'){
  const availability=startAvailability(book.key),starting=state.start.status==='starting';
  const availabilityPanel=availability.allowed?'<div class="notice"><strong>開始可能</strong><br>'+availability.reason+'</div>':'<div class="notice warn"><strong>現在、このBookは開始できません。</strong><br>開始できない理由: '+availability.reason+'</div>';
  const primary=availability.resume?btn('つづきから',"resumeBook('"+book.key+"')"):(availability.allowed?'<button class="btn" onclick="startBook(\''+book.key+'\')" '+(starting?'disabled':'')+'>'+(starting?'開始可否を確認中…':'このBookを始める')+'</button>':'<button class="btn" disabled>現在開始できません</button>');
  app.innerHTML=page('<h2>'+book.title+'</h2><div class="panel"><strong>あらすじ</strong><p>'+book.desc+'</p></div><div class="panel"><div class="fact"><span>地域</span><strong>'+(book.region||'地域情報を確認中です。')+'</strong></div><div class="fact"><span>想定時間</span><strong>'+book.time+'</strong></div></div><div class="notice warn"><strong>安全上の注意</strong><br>'+book.safety+'</div>'+availabilityPanel+(state.start.error?'<div class="notice danger" role="alert">'+state.start.error+'</div>':'')+'<div class="actions">'+btn('Book一覧へ戻る',"go('U01')",'secondary')+primary+'</div>'+(reviewMode?'<div class="panel"><strong>Start API mock確認</strong><p class="muted">画面表示後もStart時にサーバー側で開始可否を再確認します。</p><div class="actions">'+btn('API成功',"setStartMockMode('success')",'secondary')+btn('APIエラー',"setStartMockMode('error')",'secondary')+btn('直前に開始不可',"setStartMockMode('blocked')",'secondary')+'</div><p class="muted">現在のmock: '+state.start.mode+'</p></div>':''));
 }else if(state.screen==='U03'){
  const story=state.story||{chapter:1,scene:1,sceneKey:'scene-1',title:'街角のはじまり'};
  app.innerHTML=page('<p class="muted">'+book.title+' / Chapter '+story.chapter+' / Scene '+story.scene+'</p><h2>'+story.title+'</h2><div class="story"><p>店先の古い時計は、街の時間から少しだけ遅れていた。</p><p>次の手がかりは、ここから数分歩いた「青い壁の広場」にあるらしい。</p></div><div class="notice warn"><strong>移動前に確認</strong><br>歩きながら画面を見続けず、安全な場所で操作してください。</div><div class="actions">'+btn('目的地を確認する',"go('U04')")+btn('中断してBookへ',"go('U01')",'secondary')+'</div>');
 }else if(state.screen==='U04'){
  app.innerHTML='<div class="map-screen"><div id="leafletMap" class="map" role="application" aria-label="Biblio Map。目的地と周辺マーカーを表示します"></div><div class="map-overlay"><div class="map-status"><strong>目的地：青い壁の広場</strong><span>渋谷エリアのサンプル地点を表示中。地図を見ながら歩かず、安全な場所で確認してください。</span><div class="actions">'+btn('現在地を確認',"go('U05')",'secondary')+'</div></div></div></div>';setTimeout(initLeafletMap,0);
 }else if(state.screen==='U05'){
  app.innerHTML=page('<h2>到着を確認</h2><div class="notice"><strong>位置情報を使う理由</strong><br>この目的地に到着したか確認するため、今だけ端末の位置情報を利用します。</div><p>位置情報は到着確認に必要なときだけ取得します。PoCでは実位置情報は取得しません。</p><div class="actions">'+btn('到着として確認',"locationMock('ARRIVED')")+btn('まだ到着していない',"locationMock('NOT_ARRIVED')",'secondary')+btn('判定不能を試す',"locationMock('INDETERMINATE')",'secondary')+'</div>');
 }else if(state.screen==='U06'){
  app.innerHTML=page('<h2>安全に続けるために</h2><div class="notice danger"><strong>'+(state.locationResult==='NOT_ARRIVED'?'まだ目的地への到着を確認できませんでした。':'位置情報を確認できませんでした。')+'</strong><br>失敗・拒否・不明を到着成功として扱いません。</div><div class="actions">'+btn('Mapへ',"go('U04')")+btn('もう一度確認',"go('U05')",'secondary')+btn('代替進行',"alternativeProgress()",'secondary')+btn('中断',"go('U01')",'secondary')+'</div>');
 }else if(state.screen==='U08'){
  app.innerHTML=page('<h1>Book Complete</h1><p><strong>'+book.title+'</strong> を完走しました。</p><div class="panel">Completeは次Book選択や広告表示とは独立して成立します。</div><div class="actions">'+btn('次のBookを見る',"go('U09')")+btn('Book一覧へ',"go('U01')",'secondary')+'</div>');
 }else if(state.screen==='U09'){
  const next=state.books.filter(x=>x.key!==book.key&&x.available);
  app.innerHTML=page('<h2>次のBook</h2><div class="book-container">'+next.map(cover).join('')+'</div><p class="muted">候補表示だけでは次Bookは確定しません。</p>');
 }else if(state.screen==='U10'){
  const x=state.books.find(v=>v.key===state.selectedNext)||state.books.find(v=>v.key!==book.key&&v.available);
  app.innerHTML=page('<h2>次に読むBook</h2><div class="panel"><strong>'+x.title+'</strong><p>'+x.region+' / '+x.time+'</p><p>'+x.desc+'</p></div><div class="actions">'+btn('このBookを選ぶ',"selectNext('"+x.key+"')")+btn('候補へ',"go('U09')",'secondary')+'</div>');
 }else if(state.screen==='O01'){
  app.innerHTML=page('<h2>公開管理</h2><p>一般利用画面とは分離した運用PoCです。</p><div class="ops-grid"><div class="panel ops-list">'+state.books.map(x=>'<button onclick="state.book=\''+x.key+'\';render()"><strong>'+x.title+'</strong><br><small>'+x.pub+'</small></button>').join('')+'</div><div class="panel"><h3>'+book.title+'</h3><div class="fact"><span>対象版</span><strong>v2026.10-poc</strong></div><div class="fact"><span>公開状態</span><strong>'+book.pub+'</strong></div><div class="actions">'+btn('Test公開',"opsConfirm('TEST')",'secondary')+btn('本公開',"opsConfirm('LIVE')")+btn('公開停止',"opsConfirm('STOP')",'danger')+btn('版を差し替え',"opsConfirm('REPLACE')",'secondary')+'</div></div></div>');
 }
}
let leafletMapInstance=null;
function mapMarkerIcon(kind='target'){
 const cls=kind==='friend'?'map-pin friend':'map-pin';
 return L.divIcon({className:'',html:'<div class="'+cls+'"></div>',iconSize:[24,24],iconAnchor:[12,24],popupAnchor:[0,-24]});
}
function initLeafletMap(){
 const el=document.getElementById('leafletMap');
 if(!el||typeof L==='undefined')return;
 if(leafletMapInstance){leafletMapInstance.remove();leafletMapInstance=null}
 const target=[35.65952,139.70055];
 leafletMapInstance=L.map(el,{zoomControl:true,attributionControl:true}).setView(target,16);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(leafletMapInstance);
 L.marker(target,{icon:mapMarkerIcon('target')}).addTo(leafletMapInstance).bindPopup('<strong>青い壁の広場</strong><br>物語上の目的地（PoC）').openPopup();
 L.marker([35.66018,139.69898],{icon:mapMarkerIcon('friend')}).addTo(leafletMapInstance).bindPopup('Mobian A');
 L.marker([35.65858,139.70173],{icon:mapMarkerIcon('friend')}).addTo(leafletMapInstance).bindPopup('Mobian B');
 L.control.scale({imperial:false,position:'bottomleft'}).addTo(leafletMapInstance);
 requestAnimationFrame(()=>{if(leafletMapInstance)leafletMapInstance.invalidateSize()});setTimeout(()=>leafletMapInstance&&leafletMapInstance.invalidateSize(),250);
}
window.addEventListener('resize',()=>{if(leafletMapInstance)leafletMapInstance.invalidateSize()});
function loginMock(mode){state.auth.status='authenticating';state.auth.error='';render();setTimeout(()=>{if(mode==='error'){state.auth.status='logged_out';state.auth.user=null;state.auth.error='Google認証に失敗しました。時間をおいてもう一度お試しください。';render();return}const session={provider:'google',email:'poc-user@example.com',displayName:'PoC User',issuedAt:new Date().toISOString()};localStorage.setItem(SESSION_KEY,JSON.stringify(session));state.auth.status='logged_in';state.auth.user=session;state.auth.restored=false;state.auth.error='';state.screen='U04';history.replaceState({s:'U04'},'','#U04');render()},250)}
function restoreSessionMock(){try{const raw=localStorage.getItem(SESSION_KEY);if(!raw)return false;const session=JSON.parse(raw);if(session?.provider!=='google'||!session?.email)throw new Error('invalid session');state.auth.status='logged_in';state.auth.user=session;state.auth.restored=true;state.auth.error='';return true}catch(e){localStorage.removeItem(SESSION_KEY);state.auth.status='logged_out';state.auth.user=null;state.auth.error='保存されたセッションを復元できませんでした。もう一度ログインしてください。';return false}}
function logoutMock(){localStorage.removeItem(SESSION_KEY);state.auth.status='logged_out';state.auth.user=null;state.auth.restored=false;state.auth.error='';state.screen='LOGIN';history.replaceState({s:'LOGIN'},'','#LOGIN');render()}
function clearSessionMock(){localStorage.removeItem(SESSION_KEY);state.auth.status='logged_out';state.auth.user=null;state.auth.restored=false;state.auth.error='保存セッションを消去しました。';render()}
function locationMock(r){state.locationResult=r;if(r==='ARRIVED'){state.complete=true;go('U08')}else go('U06')}
function alternativeProgress(){state.locationResult='ALTERNATIVE';alert('PoC: 代替進行でStoryへ戻ります。');go('U03')}
function selectNext(key){state.book=key;state.selectedNext=null;go('U02')}
let pending=null;const dlg=document.getElementById('confirm');
function opsConfirm(a){pending=a;document.getElementById('confirmText').textContent=a==='LIVE'?'この版を本公開します。よろしいですか？':a==='STOP'?'このBookの公開を停止します。よろしいですか？':a==='TEST'?'この版をTest公開します。よろしいですか？':'公開対象の版を差し替えます。よろしいですか？';dlg.showModal()}
document.getElementById('cancelDlg').onclick=()=>{pending=null;dlg.close()}
document.getElementById('okDlg').onclick=()=>{if(pending&&pending!=='REPLACE')b().pub=pending;pending=null;dlg.close();render()}
window.addEventListener('popstate',e=>{if(e.state?.s){state.screen=e.state.s;render()}})
const restored=restoreSessionMock();
const requested=location.hash&&labels[location.hash.slice(1)]?location.hash.slice(1):null;
if(restored)state.screen=requested&&requested!=='LOGIN'?requested:'U04';
else state.screen='LOGIN';
render();
</script>
