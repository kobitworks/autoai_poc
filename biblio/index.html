<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biblio PoC</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17212b;--muted:#667085;--line:#dfe4ea;--accent:#0f766e;--accent2:#0891b2;--danger:#b42318;--warn:#b54708;--ok:#027a48;--radius:18px}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,a{font:inherit}button{cursor:pointer}.shell{max-width:1080px;margin:auto;padding:16px 16px 88px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{font-weight:800;font-size:20px}.badge{font-size:12px;background:#e6fffb;color:#0f766e;padding:6px 10px;border-radius:999px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 8px 24px rgba(16,24,40,.05);margin:12px 0}.hero{padding:24px;background:linear-gradient(135deg,#ecfeff,#ecfdf5)}h1,h2,h3{margin:0 0 10px}p{line-height:1.65}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.book{min-height:180px;display:flex;flex-direction:column;justify-content:space-between}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{background:#eef2f6;color:#243b53}.danger{background:#fee4e2;color:#b42318}.ghost{background:transparent;border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}
.notice{border-left:5px solid var(--accent2);background:#ecfdff;padding:12px 14px;border-radius:10px}.warn{border-left-color:#f79009;background:#fffaeb}.dangerbox{border-left-color:#d92d20;background:#fff1f0}.okbox{border-left-color:#12b76a;background:#ecfdf3}
.fact{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.story{font-size:18px;line-height:1.9}.map{min-height:40vh;border-radius:16px;background:radial-gradient(circle at 62% 44%,#0f766e 0 10px,transparent 11px),linear-gradient(45deg,#d1fae5 25%,transparent 25%),linear-gradient(-45deg,#cffafe 25%,transparent 25%),#f0fdf4;background-size:auto,48px 48px,48px 48px;display:flex;align-items:flex-end;padding:16px;border:1px solid var(--line)}
.routebar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;z-index:10}.routebar button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;font-size:12px}.routebar .active{background:#17212b;color:white}
.ops{max-width:1200px}.opsgrid{display:grid;grid-template-columns:360px 1fr;gap:16px}.tablelike button{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:white}.state{font-weight:800}.state.live{color:var(--ok)}.state.stop{color:var(--danger)}.state.test{color:var(--warn)}
dialog{border:0;border-radius:16px;padding:0;max-width:480px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(16,24,40,.5)}.dlg{padding:20px}
.dev{font-size:12px;color:var(--muted);margin-top:12px}.hidden{display:none!important}
@media(max-width:760px){.books,.grid,.opsgrid{grid-template-columns:1fr}.shell{padding:12px 12px 92px}.hero{padding:18px}.top{align-items:flex-start}.map{min-height:46vh}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="routebar" aria-label="PoC画面ジャンプ" id="jump"></nav>
<dialog id="confirm"><div class="dlg"><h3 id="confirmTitle">確認</h3><p id="confirmText"></p><div class="actions"><button class="btn secondary" id="cancelDlg">キャンセル</button><button class="btn primary" id="okDlg">実行</button></div></div></dialog>
<script>
const state={
  screen:'U01', book:'walk-shibuya', scene:'s1', locationResult:null,
  progress:true, complete:false, selectedNext:null,
  books:[
    {key:'walk-shibuya',title:'街角ミステリー',region:'渋谷',time:'45分',desc:'街を歩きながら手がかりを集める短編Book。',available:true,pub:'LIVE'},
    {key:'river-story',title:'川辺の記憶',region:'清澄白河',time:'35分',desc:'水辺の風景をめぐる物語。',available:true,pub:'TEST'},
    {key:'old-town',title:'古い商店街の手紙',region:'谷中',time:'50分',desc:'商店街に残された手紙を追うBook。',available:false,pub:'STOP'}
  ]
};
const label={U01:'U01 一覧',U02:'U02 詳細',U03:'U03 Story',U04:'U04 Map',U05:'U05 位置確認',U06:'U06 Safety',U08:'U08 Complete',U09:'U09 次Book',U10:'U10 選択',O01:'O01 公開管理'};
const app=document.getElementById('app'), jump=document.getElementById('jump');
function b(){return state.books.find(x=>x.key===state.book)||state.books[0]}
function go(s){state.screen=s;render();history.replaceState({s},'', '#'+s)}
function shell(body,ops=false){return '<main class="shell '+(ops?'ops':'')+'"><div class="top"><div><div class="brand">Biblio</div><div class="muted">街歩きストーリー PoC</div></div><span class="badge">MOCK / 非本番</span></div>'+body+'<p class="dev">このPoCは画面・遷移確認用です。Book公開、進行、位置到達、Complete、公開操作をClientだけで確定する本実装ではありません。</p></main>'}
function btn(text,action,cls='primary',dis=false){return '<button class="btn '+cls+'" onclick="'+action+'" '+(dis?'disabled':'')+'>'+text+'</button>'}
function render(){
 jump.innerHTML=Object.keys(label).map(k=>'<button class="'+(state.screen===k?'active':'')+'" onclick="go(\''+k+'\')">'+label[k]+'</button>').join('');
 const book=b();
 if(state.screen==='U01'){
   app.innerHTML=shell('<section class="card hero"><h1>物語を、街で読む。</h1><p>Bookを選び、安全な場所で操作しながら街をめぐります。</p></section>'+
   (state.progress?'<section class="card"><h2>つづきから</h2><p><strong>'+book.title+'</strong> — Scene 2まで進行中</p>'+btn('つづきから',"go('U03')")+'</section>':'')+
   '<h2>利用できるBook</h2><section class="books">'+state.books.map(x=>'<article class="card book"><div><h3>'+x.title+'</h3><p class="muted">'+x.region+' ・ 約'+x.time+'</p><p>'+x.desc+'</p></div>'+btn('このBookを見る',"state.book='"+x.key+"';go('U02')",'secondary')+'</article>').join('')+'</section>');
 } else if(state.screen==='U02'){
   app.innerHTML=shell('<section class="card hero"><p class="muted">'+book.region+'</p><h1>'+book.title+'</h1><p>'+book.desc+'</p></section><section class="card"><h2>始める前に</h2>'+
   '<div class="fact"><span>地域</span><strong>'+book.region+'</strong></div><div class="fact"><span>想定時間</span><strong>'+book.time+'</strong></div><div class="fact"><span>位置情報</span><strong>必要な場面だけ</strong></div><div class="fact"><span>公開状態</span><strong>'+(book.available?'開始可能':'現在開始不可')+'</strong></div>'+
   '<div class="actions">'+btn('Book一覧へ戻る',"go('U01')",'secondary')+btn(book.available?'このBookを始める':'現在、このBookは開始できません。',"mockStart()",book.available?'primary':'secondary',!book.available)+'</div></section>');
 } else if(state.screen==='U03'){
   app.innerHTML=shell('<section class="card"><p class="muted">'+book.title+' / Chapter 1 / Scene 2</p><h1>交差点の小さな違和感</h1><div class="story"><p>店先の古い時計は、街の時間から少しだけ遅れていた。</p><p>次の手がかりは、ここから数分歩いた「青い壁の広場」にあるらしい。</p></div><div class="notice warn"><strong>移動前に確認</strong><br>歩きながら画面を見続けず、安全な場所で操作してください。</div><div class="actions">'+btn('目的地を確認する',"go('U04')")+btn('中断して一覧へ',"go('U01')",'secondary')+'</div></section>');
 } else if(state.screen==='U04'){
   app.innerHTML=shell('<section class="card"><h1>目的地：青い壁の広場</h1><div class="notice warn">移動中は画面を見続けず、安全な場所で操作してください。</div><div class="map" role="img" aria-label="青い壁の広場の位置を示す簡易地図"><div class="card"><strong>青い壁の広場</strong><br><span class="muted">現在地から約350m（PoC表示）</span></div></div><p>地図を見られない場合：大通りを北へ進み、青い壁の広場を目印にしてください。</p><div class="actions">'+btn('到着確認へ',"go('U05')")+btn('Storyへ戻る',"go('U03')",'secondary')+'</div></section>');
 } else if(state.screen==='U05'){
   app.innerHTML=shell('<section class="card"><h1>到着を確認</h1><div class="notice"><strong>位置情報を使う理由</strong><br>この目的地に到着したか確認するため、今だけ端末の位置情報を利用します。</div><p>位置情報は到着確認に必要なときだけ取得します。このPoCでは実際の位置情報は取得せず、結果を選んで画面遷移を確認します。</p><div class="actions">'+btn('到着として確認',"locationMock('ARRIVED')")+btn('まだ到着していない',"locationMock('NOT_ARRIVED')",'secondary')+btn('判定不能を試す',"locationMock('INDETERMINATE')",'secondary')+btn('キャンセル',"go('U04')",'ghost')+'</div></section>');
 } else if(state.screen==='U06'){
   const arrived=state.locationResult==='NOT_ARRIVED';
   app.innerHTML=shell('<section class="card"><h1>安全に続けるために</h1><div class="notice dangerbox"><strong>'+(arrived?'まだ到着を確認できませんでした。':'位置情報を確認できませんでした。')+'</strong><br>失敗や権限拒否を到着成功として扱いません。</div><p>安全な場所で、次の行動を選んでください。</p><div class="actions">'+btn('Mapへ戻る',"go('U04')")+btn('もう一度確認',"go('U05')",'secondary')+btn('代替進行を試す',"alternativeProgress()",'secondary')+btn('Bookを中断',"go('U01')",'ghost')+'</div></section>');
 } else if(state.screen==='U08'){
   app.innerHTML=shell('<section class="card hero"><h1>Book Complete</h1><p><strong>'+book.title+'</strong> を完走しました。</p></section><section class="card"><p>Completeは次Book選択や広告表示とは独立して成立しています。</p><div class="actions">'+btn('次のBookを見る',"go('U09')")+btn('Book一覧へ戻る',"go('U01')",'secondary')+'</div></section>');
 } else if(state.screen==='U09'){
   const next=state.books.filter(x=>x.key!==book.key && x.available);
   app.innerHTML=shell('<section class="card"><h1>次のBook候補</h1><p>候補を見ただけでは選択済みになりません。</p></section><section class="books">'+next.map(x=>'<article class="card"><h3>'+x.title+'</h3><p>'+x.region+' ・ '+x.time+'</p>'+btn('候補として選ぶ',"state.selectedNext='"+x.key+"';go('U10')",'secondary')+'</article>').join('')+'</section><div class="actions">'+btn('今は選ばない',"go('U01')",'ghost')+'</div>');
 } else if(state.screen==='U10'){
   const x=state.books.find(v=>v.key===state.selectedNext)||state.books.find(v=>v.key!==book.key&&v.available);
   app.innerHTML=shell('<section class="card"><h1>次に読むBook</h1><h2>'+x.title+'</h2><p>'+x.region+' ・ '+x.time+'</p><p>'+x.desc+'</p><div class="actions">'+btn('このBookを選ぶ',"selectNext('"+x.key+"')")+btn('候補へ戻る',"go('U09')",'secondary')+'</div></section>');
 } else if(state.screen==='O01'){
   app.innerHTML=shell('<section class="card"><h1>公開管理</h1><p>一般利用画面とは分離された運用PoCです。操作はすべてmockです。</p></section><div class="opsgrid"><section class="card tablelike"><h2>Book一覧</h2>'+state.books.map(x=>'<button onclick="state.book=\''+x.key+'\';render()"><strong>'+x.title+'</strong><br><span class="state '+(x.pub==='LIVE'?'live':x.pub==='STOP'?'stop':'test')+'">'+x.pub+'</span></button>').join('')+'</section><section class="card"><h2>'+book.title+'</h2><div class="fact"><span>対象版</span><strong>v2026.10-poc</strong></div><div class="fact"><span>現在公開状態</span><strong>'+book.pub+'</strong></div><div class="actions">'+btn('Test公開',"opsConfirm('TEST')",'secondary')+btn('本公開',"opsConfirm('LIVE')")+btn('公開停止',"opsConfirm('STOP')",'danger')+btn('版を差し替え',"opsConfirm('REPLACE')",'ghost')+'</div></section></div>',true);
 }
}
function mockStart(){setTimeout(()=>{state.progress=true;go('U03')},180)}
function locationMock(r){state.locationResult=r;if(r==='ARRIVED'){setTimeout(()=>{state.complete=true;go('U08')},180)}else{go('U06')}}
function alternativeProgress(){state.locationResult='ALTERNATIVE';alert('PoC: progression_mode=ALTERNATIVE / location_reached=false としてStoryへ戻ります。');go('U03')}
function selectNext(key){state.book=key;state.selectedNext=null;go('U02')}
let pending=null; const dlg=document.getElementById('confirm');
function opsConfirm(action){pending=action;document.getElementById('confirmTitle').textContent='公開操作の確認';document.getElementById('confirmText').textContent= action==='LIVE'?'この版を本公開します。利用者へ公開されます。よろしいですか？':action==='STOP'?'このBookの公開を停止します。進行中利用者への影響を確認してください。':action==='TEST'?'この版をTest公開します。よろしいですか？':'公開対象の版を差し替えます。対象版を確認してください。';dlg.showModal()}
document.getElementById('cancelDlg').onclick=()=>{pending=null;dlg.close()}
document.getElementById('okDlg').onclick=()=>{if(pending){if(pending!=='REPLACE')b().pub=pending;else alert('PoC: 差し替え候補版を選択した想定です。');pending=null;dlg.close();render()}}
window.addEventListener('popstate',e=>{if(e.state&&e.state.s){state.screen=e.state.s;render()}})
if(location.hash&&label[location.hash.slice(1)])state.screen=location.hash.slice(1);
render();
</script>
</body>
</html>
