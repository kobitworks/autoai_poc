<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>QR・バーコード探索PoC</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#fff}main{max-width:760px;margin:auto;padding:16px}input,button{font-size:18px;padding:12px;margin:4px 0;box-sizing:border-box}input{width:100%}button{margin-right:8px}video{width:100%;max-height:60vh;background:#000;margin-top:12px}.status{padding:12px;margin-top:12px;background:#333;border-radius:8px}.hit{position:fixed;inset:0;background:rgba(0,255,80,.32);display:none;pointer-events:none;z-index:9}.hit.on{display:block}</style><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script></head><body><div id="hit" class="hit"></div><main><h1>QR・バーコード探索PoC</h1><label>探すコード</label><input id="target" value="4901880816445" inputmode="numeric"><div><button id="start">カメラ開始</button><button id="stop">停止</button></div><video id="video" autoplay playsinline muted></video><div id="status" class="status">待機中</div></main><script>const v=document.querySelector('#video'),s=document.querySelector('#status'),h=document.querySelector('#hit'),t=document.querySelector('#target');let controls=null,reader=null,lastHit='';async function start(){stop(false);if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){s.textContent='このブラウザではカメラを利用できません。';return}if(!window.ZXingBrowser){s.textContent='読取ライブラリの読み込みに失敗しました。再読み込みしてください。';return}try{reader=new ZXingBrowser.BrowserMultiFormatReader();s.textContent='カメラを起動しています…';controls=await reader.decodeFromConstraints({audio:false,video:{facingMode:{ideal:'environment'}}},v,(result,error)=>{if(!result)return;const value=result.getText();const target=t.value.trim();if(value===target&&target){h.classList.add('on');s.textContent='一致しました: '+value;if(lastHit!==value&&navigator.vibrate)navigator.vibrate([120,60,120]);lastHit=value}else{h.classList.remove('on');s.textContent='検出: '+value;lastHit=''}});s.textContent='探索中…'}catch(e){s.textContent='カメラ開始エラー: '+(e&&e.message?e.message:e)}}function stop(show=true){if(controls){controls.stop();controls=null}h.classList.remove('on');lastHit='';if(show)s.textContent='停止しました'}document.querySelector('#start').onclick=start;document.querySelector('#stop').onclick=()=>stop(true);</script></body></html>
