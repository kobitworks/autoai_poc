<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>QR・バーコード探索PoC</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#fff}main{max-width:760px;margin:auto;padding:16px}input,button{font-size:18px;padding:12px;margin:4px 0;box-sizing:border-box}input{width:100%}button{margin-right:8px}video{width:100%;max-height:60vh;background:#000;margin-top:12px}.status{padding:12px;margin-top:12px;background:#333;border-radius:8px}.hit{position:fixed;inset:0;background:rgba(0,255,80,.32);display:none;pointer-events:none;z-index:9}.hit.on{display:block}</style></head><body><div id="hit" class="hit"></div><main><h1>QR・バーコード探索PoC</h1><label>探すコード</label><input id="target" value="4901880816445" inputmode="numeric"><div><button id="start">カメラ開始</button><button id="stop">停止</button></div><video id="video" autoplay playsinline muted></video><div id="status" class="status">待機中</div></main><script>const v=document.querySelector('#video'),s=document.querySelector('#status'),h=document.querySelector('#hit'),t=document.querySelector('#target');let stream=null,running=false,detector=null;async function start(){if(!('BarcodeDetector'in window)){s.textContent='このブラウザはBarcodeDetectorに対応していません。';return}try{detector=new BarcodeDetector({formats:['qr_code','ean_13','ean_8','code_128','code_39','upc_a','upc_e']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=stream;running=true;s.textContent='探索中…';scan()}catch(e){s.textContent='カメラ開始エラー: '+e.message}}function stop(){running=false;if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}v.srcObject=null;h.classList.remove('on');s.textContent='停止しました'}async function scan(){if(!running)return;try{const codes=await detector.detect(v);const target=t.value.trim();const found=codes.find(c=>c.rawValue===target);if(found&&target){h.classList.add('on');s.textContent='一致しました: '+found.rawValue;if(navigator.vibrate)navigator.vibrate([120,60,120])}else{h.classList.remove('on');s.textContent=codes.length?'検出: '+codes.map(c=>c.rawValue).join(', '):'探索中…'}}catch(e){}requestAnimationFrame(scan)}document.querySelector('#start').onclick=start;document.querySelector('#stop').onclick=stop;</script></body></html>
