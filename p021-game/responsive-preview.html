<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P021 Responsive Preview</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8f5f8;background:#07111d}
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#07111d}
header{position:sticky;top:0;z-index:10;background:rgba(7,17,29,.96);padding:12px 0 16px;border-bottom:1px solid #23445b}
h1{font-size:20px;margin:0 0 10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid #39718d;background:#10283a;color:#e8f5f8;border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer}
button.active{background:#176b82;border-color:#65d7f0}
.meta{margin-top:10px;font-size:13px;color:#9fc7d7}
.stage{padding:22px;overflow:auto;min-height:calc(100vh - 140px);display:flex;align-items:flex-start;justify-content:center}
.frame-shell{background:#000;border:2px solid #52cce7;border-radius:12px;box-shadow:0 18px 55px rgba(0,0,0,.45);overflow:hidden;flex:0 0 auto}
iframe{display:block;border:0;background:#000}
</style>
</head>
<body>
<header>
<h1>P021 Responsive Preview</h1>
<div class="toolbar">
<button data-w="390" data-h="844">Phone Portrait 390×844</button>
<button data-w="844" data-h="390">Phone Landscape 844×390</button>
<button data-w="768" data-h="1024">Tablet Portrait 768×1024</button>
<button data-w="1024" data-h="768">Tablet Landscape 1024×768</button>
</div>
<div class="meta"><span id="game"></span> / <strong id="size"></strong></div>
</header>
<main class="stage">
<div class="frame-shell"><iframe id="preview" allow="autoplay; fullscreen"></iframe></div>
</main>
<script>
const params=new URLSearchParams(location.search);
const game=params.get('game')||'games/one-square-farm-godot-v4/';
const frame=document.getElementById('preview');
const size=document.getElementById('size');
const gameLabel=document.getElementById('game');
gameLabel.textContent=game;
frame.src=new URL(game,location.href).href;
function setSize(w,h,button){
 frame.style.width=w+'px'; frame.style.height=h+'px';
 size.textContent=w+' × '+h;
 document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===button));
}
document.querySelectorAll('button').forEach(btn=>{
 btn.addEventListener('click',()=>setSize(Number(btn.dataset.w),Number(btn.dataset.h),btn));
});
const first=document.querySelector('button');
setSize(390,844,first);
</script>
</body>
</html>
