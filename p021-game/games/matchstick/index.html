<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17212b">
  <title>Matchstick | GAME-G015</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <nav class="gameNav" aria-label="P021 navigation">
      <a href="../../">← Game Development Lab</a>
      <span>GAME-G015 · HTML/JS</span>
    </nav>

    <section id="screenTop" class="screen screen-top" aria-label="top">
      <div class="topCard">
        <div class="badgeRow"><span class="badge">MATCH PUZZLE</span><span class="badge soft">higher score</span></div>
        <div class="topBrand">
          <h1 class="topTitle">マッチ棒クイズ</h1>
          <p class="topSub">数字のマッチ棒を<strong>1本だけ</strong>取り、別の場所へ置いて正しい式を作ろう。</p>
        </div>
        <ol class="howto">
          <li>光っている数字の棒を1本選ぶ</li>
          <li>置ける場所へその棒を移す</li>
          <li>「判定」で式をチェック</li>
        </ol>
        <div class="topForm">
          <label class="field">
            <span class="label">難易度</span>
            <select id="topLevel" class="select" aria-label="difficulty">
              <option value="easy" selected>Easy（1桁・＋/−）</option>
              <option value="normal">Normal（2桁含む・＋/−）</option>
              <option value="hard">Hard（2桁含む・＋/−/×）</option>
            </select>
          </label>
          <label class="field">
            <span class="label">ラウンド数</span>
            <select id="topRounds" class="select" aria-label="rounds">
              <option value="1">1</option>
              <option value="3">3</option>
              <option value="5" selected>5</option>
              <option value="7">7</option>
              <option value="10">10</option>
            </select>
          </label>
          <button id="btnStart" class="btnPrimary" type="button">ゲーム開始</button>
        </div>
      </div>
    </section>

    <section id="screenGame" class="screen screen-game hidden" aria-label="game">
      <div class="hud">
        <div class="hudGroup">
          <div class="pill"><span class="k">ROUND</span><span id="hudRound" class="v">1/5</span></div>
          <div class="pill"><span class="k">SCORE</span><span id="hudScore" class="v">0</span></div>
        </div>
        <div class="pill warn" id="carryPill" aria-live="polite">棒：未選択</div>
      </div>

      <div class="card gameCard">
        <p class="mission">1本だけ移動して、式を成立させよう</p>
        <div class="equationWrap"><div id="equation" class="equation" aria-label="equation"></div></div>
        <div class="controls">
          <button id="btnCheck" class="btnPrimary" type="button" disabled>判定</button>
          <button id="btnReset" class="btnGhost" type="button">リセット</button>
          <button id="btnSkip" class="btnGhost danger" type="button">スキップ −1</button>
        </div>
        <div class="msgRow"><div id="msg" class="msg" aria-live="polite"></div></div>
      </div>
    </section>

    <section id="screenResult" class="screen screen-result hidden" aria-label="result">
      <div class="card resultCard">
        <div class="resultKicker">RESULT</div>
        <div class="resultTitle">今回のスコア</div>
        <div class="resultScore"><span id="finalScore">0</span></div>
        <div class="resultMeta" id="finalMeta"></div>
        <div class="bestLine">BEST <strong id="finalBest">0</strong></div>
        <p class="scoreNote">正解 +2 / 不正解・スキップ −1。スコアは<strong>高いほど上位</strong>です。</p>
        <div class="controls">
          <button id="btnRestart" class="btnPrimary" type="button">もう一度</button>
          <button id="btnBackToTop" class="btnGhost" type="button">設定へ戻る</button>
        </div>
        <a class="portalLink" href="../../">ゲーム一覧へ</a>
      </div>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
