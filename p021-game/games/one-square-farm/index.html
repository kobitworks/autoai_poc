<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f603d">
<title>1マス農園 | GAME-G001</title>
<style>
:root{--g:#1e6843;--g2:#32a463;--ink:#1d2c25;--muted:#6d766f;--line:#dfe4dc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#eff9eb,#e8f0e6 38%,#dce7df);color:var(--ink);font-family:ui-rounded,"Yu Gothic",system-ui,sans-serif}.shell{width:min(1120px,calc(100% - 24px));margin:auto;padding:18px 0 48px}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:14px}.top>div{text-align:center}.over{margin:0;color:var(--g);font-size:11px;font-weight:900;letter-spacing:.14em}h1{margin:2px 0 0;font-size:clamp(28px,5vw,42px)}a{color:#315947;text-decoration:none;font-weight:800}.reset{justify-self:end;border:1px solid #bdd0c2;background:#ffffffb3;color:#315947;border-radius:11px;padding:10px 14px;font-weight:800}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}.hud div,.panel,.side section{background:#fffffff0;border:1px solid #d7e3da;border-radius:18px;box-shadow:0 12px 28px #284d3912}.hud div{padding:12px}.hud span,.hud strong{display:block}.hud span{font-size:11px;color:var(--muted);font-weight:800}.hud strong{font-size:17px}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,.75fr);gap:12px}.panel{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1fr);gap:18px;padding:22px}.plot{position:relative;aspect-ratio:1;width:min(100%,410px);margin:auto;display:grid;place-items:center;border:14px solid #a87552;border-radius:28px;background:repeating-linear-gradient(45deg,#6c4633 0 14px,#76503a 14px 28px);box-shadow:inset 0 0 0 3px #ffffff1a,0 12px 24px #452d1f29}.plant{font-size:clamp(78px,15vw,150px);filter:drop-shadow(0 12px 7px #1f1b0f2e)}.drop{position:absolute;top:20px;right:22px;font-size:34px}.caption{display:flex;justify-content:space-between;gap:8px;margin:14px 2px 8px}.caption span{font-size:12px;color:var(--muted)}.meter{height:10px;background:#e6ede7;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#78c85a,#28a865);transition:.3s}.actions{align-self:center}.actions h2,.side h2{margin:0 0 12px;font-size:18px}.agrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{border:0;border-radius:14px;min-height:54px;padding:10px;background:#eff5ef;color:#284b38;font-weight:900;font-size:14px;cursor:pointer}button:active{transform:scale(.97)}button:disabled{opacity:.42}.next{width:100%;margin-top:9px;color:#fff;background:linear-gradient(135deg,#278d56,#18613f)}.hint{font-size:12px;line-height:1.6;color:var(--muted)}.side{display:grid;gap:12px}.side section{padding:18px}.choices{display:grid;gap:8px}.crop{width:100%;border:1px solid #dce7de;background:#f7faf7;text-align:left;min-height:auto}.crop.sel{border:2px solid #66b781;background:#e8f6ec}.crop strong,.crop span{display:block}.crop span{font-size:11px;color:var(--muted);margin-top:3px}.log{max-height:270px;overflow:auto;margin:0;padding-left:22px;font-size:12px;line-height:1.6;color:#53645a}.log li{padding:4px 0;border-bottom:1px dashed #e1e7e2}dialog{width:min(420px,calc(100% - 32px));border:0;border-radius:22px;padding:28px;text-align:center;box-shadow:0 30px 80px #0004}dialog::backdrop{background:#14261c80}.result{font-size:68px}@media(max-width:850px){.hud{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:650px){.top{grid-template-columns:1fr auto}.top>div{grid-column:1/-1;grid-row:1}.hud{grid-template-columns:repeat(2,1fr)}.panel{grid-template-columns:1fr;padding:14px}.plot{max-width:330px}}
</style></head>
<body><main class="shell"><header class="top"><a href="../../">← ゲーム一覧</a><div><p class="over">GAME-G001</p><h1>1マス農園</h1></div><button id="reset" class="reset">最初から</button></header>
<section class="hud"><div><span>DAY</span><strong id="day">1 / 15</strong></div><div><span>所持金</span><strong id="coin">60 G</strong></div><div><span>水</span><strong id="water">3 / 5</strong></div><div><span>土</span><strong id="soil">70</strong></div><div><span>天気</span><strong id="weather">☀️ 晴れ</strong></div></section>
<section class="layout"><div class="panel"><div><div class="plot"><div id="plant" class="plant">🟫</div><div id="drop" class="drop" hidden>💧</div></div><div class="caption"><strong id="cropName">空きマス</strong><span id="growth">作物を選んで植えよう</span></div><div class="meter"><div id="bar" class="fill"></div></div></div>
<div class="actions"><h2>今日の操作</h2><div class="agrid"><button id="plantBtn">🌱 植える</button><button id="waterBtn">💧 水やり</button><button id="compostBtn">🪱 土づくり -5G</button><button id="harvestBtn">🧺 収穫</button></div><button id="nextBtn" class="next">日を進める →</button><p class="hint">目標：15日終了時に <b>150G以上</b>。1マスしかないので、作物選びと土・水管理が重要です。</p></div></div>
<aside class="side"><section><h2>種を選ぶ</h2><div id="choices" class="choices"></div></section><section><h2>農園ログ</h2><ol id="log" class="log" reversed></ol></section></aside></section></main>
<dialog id="result"><div id="resultIcon" class="result">🌾</div><h2 id="resultTitle"></h2><p id="resultText"></p><button id="again">もう一度遊ぶ</button></dialog>
<script>
(()=>{const C={radish:{n:"ラディッシュ",e:"🥕",seed:8,d:3,sell:24,note:"早い・安定"},lettuce:{n:"レタス",e:"🥬",seed:12,d:4,sell:38,note:"中速・バランス"},tomato:{n:"トマト",e:"🍅",seed:18,d:5,sell:58,note:"遅い・高収益"}};const W=[{n:"☀️ 晴れ",rain:false,w:5},{n:"⛅ くもり",rain:false,w:3},{n:"🌧️ 雨",rain:true,w:2}],K="p021-one-square-farm-v1";let s=load()||fresh();const q=id=>document.getElementById(id),E={day:q("day"),coin:q("coin"),water:q("water"),soil:q("soil"),weather:q("weather"),plant:q("plant"),drop:q("drop"),cropName:q("cropName"),growth:q("growth"),bar:q("bar"),choices:q("choices"),log:q("log"),plantBtn:q("plantBtn"),waterBtn:q("waterBtn"),compostBtn:q("compostBtn"),harvestBtn:q("harvestBtn"),nextBtn:q("nextBtn"),reset:q("reset"),result:q("result"),again:q("again"),resultIcon:q("resultIcon"),resultTitle:q("resultTitle"),resultText:q("resultText")};function fresh(){return{day:1,max:15,coins:60,water:3,soil:70,wi:0,sel:"radish",crop:null,logs:[],harvests:0,earned:0,ended:false}}function save(){localStorage.setItem(K,JSON.stringify(s))}function load(){try{let x=JSON.parse(localStorage.getItem(K));return x&&x.max===15?x:null}catch{return null}}function log(m){s.logs.push("DAY "+s.day+": "+m);if(s.logs.length>24)s.logs.shift();save();render()}function weighted(){let t=W.reduce((a,x)=>a+x.w,0),r=Math.random()*t;for(let i=0;i<W.length;i++){r-=W[i].w;if(r<=0)return i}return 0}function stage(c){if(!c)return"🟫";let d=C[c.k],r=c.g/d.d;return r<.3?"🌱":r<.7?"🌿":r<1?"🪴":d.e}function plant(){if(s.crop||s.ended)return;let d=C[s.sel];if(s.coins<d.seed)return log("種を買うお金が足りない。");s.coins-=d.seed;s.crop={k:s.sel,g:0,wet:false,h:100};log(d.n+"を植えた（-"+d.seed+"G）。")}function water(){if(!s.crop||s.crop.wet||s.water<=0||s.ended)return;s.water--;s.crop.wet=true;log("畑に水をやった。")}function compost(){if(s.ended)return;if(s.coins<5)return log("土づくり用の5Gが足りない。");if(s.soil>=100)return log("土はすでに最高の状態。");s.coins-=5;s.soil=Math.min(100,s.soil+24);log("堆肥を入れた（-5G）。")}function harvest(){if(!s.crop||s.ended)return;let d=C[s.crop.k];if(s.crop.g<d.d)return log("まだ収穫には早い。");let rev=Math.round(d.sell*Math.max(.55,s.crop.h/100)*(s.soil>=70?1.1:1));s.coins+=rev;s.earned+=rev;s.harvests++;s.crop=null;s.soil=Math.max(10,s.soil-8);log(d.n+"を収穫！ +"+rev+"G。")}function next(){if(s.ended)return;if(s.day>=s.max)return finish();if(s.crop){let rain=W[s.wi].rain,hyd=s.crop.wet||rain;if(rain&&!s.crop.wet)log("雨が畑を潤してくれた。");let sr=s.soil>=60?1:s.soil>=35?.8:.6,wr=hyd?1:.42;s.crop.g+=sr*wr;if(!hyd){s.crop.h=Math.max(35,s.crop.h-14);s.logs.push("DAY "+s.day+": 水不足で作物が少し弱った。")}else s.crop.h=Math.min(100,s.crop.h+2);s.soil=Math.max(10,s.soil-6);s.crop.wet=false}s.day++;s.water=Math.min(5,s.water+2);s.wi=weighted();log("DAY "+s.day+"。"+W[s.wi].n+"。水が2回分補充された。")}function finish(){s.ended=true;save();render();let ok=s.coins>=150;E.resultIcon.textContent=ok?"🏆":"🌱";E.resultTitle.textContent=ok?"農園、大成功！":"15日終了！";E.resultText.textContent="最終資金 "+s.coins+"G、収穫 "+s.harvests+"回、売上 "+s.earned+"G。"+(ok?"小さな1マスから立派に黒字化しました。":"150Gには届かなかったけれど、作物の順番と土づくりを変えると伸びます。");E.result.showModal()}function render(){let d=s.crop?C[s.crop.k]:null;E.day.textContent=s.day+" / "+s.max;E.coin.textContent=s.coins+" G";E.water.textContent=s.water+" / 5";E.soil.textContent=s.soil;E.weather.textContent=W[s.wi].n;if(!d){E.cropName.textContent="空きマス";E.growth.textContent="作物を選んで植えよう";E.bar.style.width="0%";E.plant.textContent="🟫"}else{let p=Math.min(100,Math.round(s.crop.g/d.d*100));E.cropName.textContent=d.n;E.growth.textContent=(s.crop.g>=d.d?"収穫OK":"成長 "+p+"%")+" · 元気 "+s.crop.h+"%";E.bar.style.width=p+"%";E.plant.textContent=stage(s.crop)}E.drop.hidden=!s.crop?.wet;[...E.choices.querySelectorAll(".crop")].forEach(b=>{b.classList.toggle("sel",b.dataset.k===s.sel);b.disabled=!!s.crop||s.ended});E.plantBtn.disabled=!!s.crop||s.ended||s.coins<C[s.sel].seed;E.waterBtn.disabled=!s.crop||s.crop?.wet||s.water<=0||s.ended;E.compostBtn.disabled=s.coins<5||s.soil>=100||s.ended;E.harvestBtn.disabled=!s.crop||s.crop.g<(d?.d||999)||s.ended;E.nextBtn.disabled=s.ended;E.nextBtn.textContent=s.day>=s.max?"結果を見る →":"日を進める →";E.log.innerHTML=s.logs.slice().reverse().map(x=>"<li>"+x.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+"</li>").join("")}E.choices.innerHTML=Object.entries(C).map(([k,d])=>'<button class="crop" data-k="'+k+'"><strong>'+d.e+" "+d.n+'</strong><span>種 '+d.seed+"G / "+d.d+"日 / 基本売価 "+d.sell+"G · "+d.note+"</span></button>").join("");E.choices.onclick=e=>{let b=e.target.closest("[data-k]");if(!b||s.crop)return;s.sel=b.dataset.k;log(C[s.sel].n+"の種を選んだ。")};E.plantBtn.onclick=plant;E.waterBtn.onclick=water;E.compostBtn.onclick=compost;E.harvestBtn.onclick=harvest;E.nextBtn.onclick=next;function reset(){s=fresh();localStorage.removeItem(K);if(E.result.open)E.result.close();log("新しい農園を始めた。")}E.reset.onclick=reset;E.again.onclick=reset;if(!s.logs.length)log("1マス農園へようこそ。最初の種を選ぼう。");render()})();
</script></body></html>
