<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7f8">
  <title>Othello | GAME-G010</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="screenTop" class="screen screen-top" aria-label="ゲーム開始">
    <div class="topCard">
      <div class="topBrand">
        <div class="topTitle">Othello</div>
        <div class="topSub">CPU（ミニマックス＋αβ）と対戦する8×8オセロ。先手／後手とCPUの読み深さを選んで開始します。</div>
      </div>
      <div class="topForm">
        <label class="field"><span class="label">先手</span>
          <select id="starter" class="select" aria-label="先手">
            <option value="human" selected>あなた先手（あなた＝黒）</option>
            <option value="cpu">CPU先手（CPU＝黒）</option>
          </select>
        </label>
        <label class="field"><span class="label">CPU難易度</span>
          <select id="difficulty" class="select" aria-label="難易度">
            <option value="3" selected>レベル3（3手読み）</option>
            <option value="4">レベル4（4手読み）</option>
            <option value="5">レベル5（5手読み）</option>
          </select>
        </label>
        <div class="topActions"><button id="btnStart" class="btn primary" type="button">ゲーム開始</button></div>
        <a class="portalLink" href="../../">P021 ゲーム一覧へ戻る</a>
      </div>
    </div>
  </section>

  <section id="screenGame" class="screen screen-game hidden" aria-label="ゲーム">
    <main class="main">
      <div class="gameCard">
        <div class="gameHead">
          <div><strong>Othello</strong><span class="gameId">GAME-G010</span></div>
          <div class="gameActions">
            <button id="toggleHints" class="ctl" type="button">候補: ON</button>
            <button id="newGame" class="ctl" type="button">再戦</button>
            <button id="btnToTop" class="ctl" type="button">一覧</button>
          </div>
        </div>
        <div class="info">
          <div class="statusRow">
            <div class="badge"><span class="dot"></span><span id="turnLabel">手番：-</span></div>
            <div class="badge"><span id="countLabel">黒 2 / 白 2</span></div>
          </div>
          <div id="msg" class="msg" aria-live="polite"></div>
        </div>
        <div class="boardWrap"><div id="board" class="board" role="grid" aria-label="オセロ盤"></div></div>
      </div>
    </main>
  </section>
</div>
<script src="platform-adapter.js"></script>
<script src="main.js"></script>
</body>
</html>
