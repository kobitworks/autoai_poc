<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>タブレットナビ PoC</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f4f7f8;--card:#fff;--line:#dfe7ea;--text:#17313b;--muted:#6b7e86;
  --cyan:#10b9c8;--cyan-dark:#078d99;--emerald:#20b486;--shadow:0 8px 24px rgba(23,49,59,.10)
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{background:var(--bg);padding:14px 16px 12px;z-index:1000}
.header-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.back{color:var(--cyan-dark);text-decoration:none;font-size:15px;font-weight:800;white-space:nowrap}
.version{font-size:12px;color:var(--muted);background:#eef4f5;border-radius:999px;padding:5px 9px}
h1{font-size:22px;margin:0 0 12px;letter-spacing:.01em}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px}
input,button{font:inherit;border-radius:12px;border:1px solid var(--line);min-height:50px}
input{padding:0 14px;font-size:18px;background:#fbfdfd;color:var(--text);outline:none}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(16,185,200,.12)}
button{padding:0 15px;background:#fff;color:var(--text);font-weight:800;cursor:pointer}
button:hover{border-color:#b9cdd2}
button.primary{background:linear-gradient(135deg,var(--cyan),var(--emerald));color:#fff;border-color:transparent}
#voice,#locate{min-width:54px}
#status{font-size:13px;color:var(--muted);margin-top:9px;min-height:18px;line-height:1.4}
.map-wrap{position:relative;margin:0 16px 16px;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:#dfe7ea}
#map{width:100%;height:100%;min-height:360px}
#panel{position:absolute;left:28px;right:28px;bottom:28px;z-index:900;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border:1px solid rgba(223,231,234,.95);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:none}
#panel strong{font-size:22px;color:var(--cyan-dark)}
#panel span{color:var(--muted);margin-left:8px;font-weight:700}
#panel small{display:block;margin-top:4px;color:#4d626a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaflet-control-zoom a{width:46px!important;height:46px!important;line-height:46px!important;font-size:26px!important}
@media (max-width:760px){
  header{padding:10px}.header-card{padding:12px}.row{grid-template-columns:1fr auto auto}.row #locate{grid-column:1/-1}
  .map-wrap{margin:0 10px 10px}.topline{margin-bottom:8px}h1{font-size:20px}
}
@media (orientation:landscape) and (min-width:761px){
  header{padding:10px 14px 10px}.header-card{padding:10px 14px}h1{font-size:20px;margin-bottom:8px}
}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="header-card">
    <div class="topline"><a class="back" href="../">← PoC一覧へ戻る</a><span class="version">Version 0.3</span></div>
    <h1>🚚 タブレットナビ</h1>
    <div class="row">
      <input id="q" type="search" inputmode="search" placeholder="目的地を入力（例：渋川駅）" autocomplete="off">
      <button id="voice" title="音声入力">🎤</button>
      <button id="search" class="primary">検索</button>
      <button id="locate">現在地へ</button>
    </div>
    <div id="status">GPSを開始しています…</div>
  </div>
</header>
<div class="map-wrap"><div id="map"></div></div>
</div>
<div id="panel"><strong id="distance"></strong><span id="duration"></span><small id="dest"></small></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const statusEl=document.getElementById('status'), q=document.getElementById('q');
const panel=document.getElementById('panel'), distEl=document.getElementById('distance'), durEl=document.getElementById('duration'), destEl=document.getElementById('dest');
const map=L.map('map',{zoomControl:true}).setView([36.2,138.2],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

let current=null,currentMarker=null,accuracyCircle=null,destMarker=null,routeLine=null,watchId=null,firstFix=true;
function setStatus(s){statusEl.textContent=s}
function gpsError(e){
  const msg=e&&e.code===1?'位置情報が拒否されています。ブラウザ設定でこのサイトの位置情報を「許可」にしてください。':
            e&&e.code===2?'現在地を取得できません。GPS/Wi-Fi/モバイル通信を確認してください。':
            e&&e.code===3?'GPS取得がタイムアウトしました。屋外で「GPS再取得」を押してください。':
            '現在地を取得できません。';
  setStatus(msg);
}
function onPosition(p){
  const c=p.coords;
  current=[c.latitude,c.longitude];
  const acc=Math.round(c.accuracy||0);
  if(currentMarker) currentMarker.setLatLng(current);
  else currentMarker=L.marker(current).addTo(map).bindPopup('現在地');
  if(accuracyCircle) accuracyCircle.setLatLng(current).setRadius(c.accuracy||0);
  else accuracyCircle=L.circle(current,{radius:c.accuracy||0,weight:1,fillOpacity:.08}).addTo(map);
  if(firstFix){map.setView(current,16);firstFix=false}
  setStatus('GPS受信中：精度 約'+acc+'m'+(acc>100?'（精度が低めです）':''));
}
function startGps(){
  if(!navigator.geolocation){setStatus('このブラウザでは位置情報を利用できません。');return}
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  firstFix=true;
  setStatus('GPSを取得しています…');
  watchId=navigator.geolocation.watchPosition(onPosition,gpsError,{
    enableHighAccuracy:true,
    timeout:20000,
    maximumAge:1000
  });
}
function recenter(){
  if(current){map.setView(current,16);setStatus('現在地を中心に戻しました。GPSは継続測位中です。')}
  else startGps();
}

async function searchDest(){
  const text=q.value.trim(); if(!text){setStatus('目的地を入力してください');return}
  setStatus('目的地を検索しています…');
  try{
    const u='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&accept-language=ja&q='+encodeURIComponent(text);
    const r=await fetch(u); const data=await r.json();
    if(!data.length){setStatus('目的地が見つかりませんでした');return}
    const d=[+data[0].lat,+data[0].lon];
    if(destMarker) destMarker.setLatLng(d).setPopupContent(data[0].display_name);
    else destMarker=L.marker(d).addTo(map).bindPopup(data[0].display_name);
    destMarker.openPopup();
    destEl.textContent=data[0].display_name;
    if(current) await drawRoute(current,d);
    else {map.setView(d,15);setStatus('目的地を表示しました。GPS取得後に経路表示できます。')}
  }catch(e){setStatus('検索に失敗しました。通信状態を確認してください。')}
}
async function drawRoute(a,b){
  setStatus('ルートを計算しています…');
  try{
    const u='https://router.project-osrm.org/route/v1/driving/'+a[1]+','+a[0]+';'+b[1]+','+b[0]+'?overview=full&geometries=geojson';
    const r=await fetch(u); const data=await r.json();
    if(!data.routes||!data.routes.length) throw new Error();
    const route=data.routes[0], pts=route.geometry.coordinates.map(x=>[x[1],x[0]]);
    if(routeLine) map.removeLayer(routeLine);
    routeLine=L.polyline(pts,{weight:7,opacity:.8}).addTo(map);
    map.fitBounds(routeLine.getBounds(),{padding:[30,30]});
    distEl.textContent=(route.distance/1000).toFixed(1)+' km';
    durEl.textContent='約'+Math.max(1,Math.round(route.duration/60))+'分';
    panel.style.display='block';
    setStatus('ルート表示中。GPSは継続測位しています。');
  }catch(e){setStatus('ルート計算に失敗しました。目的地は地図上に表示しています。')}
}

document.getElementById('search').onclick=searchDest;
document.getElementById('locate').onclick=recenter;
q.addEventListener('keydown',e=>{if(e.key==='Enter')searchDest()});
map.on('click',async e=>{
  if(destMarker) destMarker.setLatLng(e.latlng); else destMarker=L.marker(e.latlng).addTo(map);
  destEl.textContent='地図で指定した地点';
  if(current) await drawRoute(current,[e.latlng.lat,e.latlng.lng]);
});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
document.getElementById('voice').onclick=()=>{
  if(!SR){setStatus('このブラウザは音声入力に対応していません。キーボード入力を使ってください。');return}
  const r=new SR(); r.lang='ja-JP'; r.interimResults=false; r.maxAlternatives=1;
  setStatus('目的地を話してください…');
  r.onresult=e=>{q.value=e.results[0][0].transcript;searchDest()};
  r.onerror=()=>setStatus('音声入力に失敗しました。');
  r.start();
};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&watchId===null)startGps()});
window.addEventListener('beforeunload',()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId)});
startGps();
</script>
</body>
</html>
