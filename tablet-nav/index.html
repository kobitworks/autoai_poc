<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>タブレットナビ PoC</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#111;color:#111}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{background:#fff;padding:10px 12px;box-shadow:0 2px 10px #0002;z-index:1000}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.back{color:#1769e0;text-decoration:none;font-size:15px;font-weight:700;white-space:nowrap}
.version{font-size:13px;color:#667085}
h1{font-size:18px;margin:0 0 8px}
.row{display:grid;grid-template-columns:1fr auto auto;gap:8px}
input,button{font:inherit;border-radius:10px;border:1px solid #cfd5dc;min-height:48px}
input{padding:0 12px;font-size:18px}
button{padding:0 14px;background:#fff;font-weight:700}
button.primary{background:#1769e0;color:#fff;border-color:#1769e0}
#status{font-size:13px;color:#667085;margin-top:6px;min-height:18px;line-height:1.35}
#mapWrap{position:relative;width:100%;height:100%;min-height:0}
#map{width:100%;height:100%}
#driveHud{position:absolute;right:12px;top:12px;z-index:900;display:grid;grid-template-columns:repeat(2,minmax(112px,1fr));gap:8px;pointer-events:none}
.hudCard{min-width:112px;background:#111e;color:#fff;border:1px solid #ffffff30;border-radius:14px;padding:10px 12px;box-shadow:0 3px 14px #0005;text-align:center;backdrop-filter:blur(4px)}
.hudLabel{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;color:#d0d5dd}
.hudValue{font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.hudUnit{font-size:14px;margin-left:3px;color:#d0d5dd}
.hudSub{display:block;min-height:16px;margin-top:4px;font-size:11px;color:#98a2b3}
#headingValue{font-size:34px}
#panel{position:absolute;left:12px;right:12px;bottom:16px;z-index:900;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 3px 16px #0004;display:none}
#panel strong{font-size:20px}
#panel span{color:#667085;margin-left:8px}
.leaflet-control-zoom a{width:44px!important;height:44px!important;line-height:44px!important;font-size:26px!important}
@media (orientation:landscape){header{padding:8px 12px}.row{grid-template-columns:minmax(320px,1fr) auto auto auto}}
@media (max-width:560px){#driveHud{grid-template-columns:repeat(2,minmax(96px,1fr));right:8px;top:8px}.hudCard{min-width:96px;padding:8px}.hudValue{font-size:38px}#headingValue{font-size:30px}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="topline"><a class="back" href="../">← PoC一覧へ戻る</a><span class="version">Version 0.3</span></div>
  <h1>🚚 タブレットナビ PoC</h1>
  <div class="row">
    <input id="q" type="search" inputmode="search" placeholder="目的地を入力（例：渋川駅）" autocomplete="off">
    <button id="voice" title="音声入力">🎤</button>
    <button id="search" class="primary">検索</button>
    <button id="locate">現在地へ</button>
  </div>
  <div id="status">GPSを開始しています…</div>
</header>
<div id="mapWrap">
  <div id="map"></div>
  <div id="driveHud" aria-live="polite">
    <div class="hudCard">
      <span class="hudLabel">GPS速度</span>
      <strong id="speedValue" class="hudValue">--</strong><span class="hudUnit">km/h</span>
      <small id="speedSource" class="hudSub">測位待ち</small>
    </div>
    <div class="hudCard">
      <span class="hudLabel">方角</span>
      <strong id="headingValue" class="hudValue">--</strong>
      <small id="headingDetail" class="hudSub">測位待ち</small>
    </div>
  </div>
</div>
</div>
<div id="panel"><strong id="distance"></strong><span id="duration"></span><br><small id="dest"></small></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const statusEl=document.getElementById('status'), q=document.getElementById('q');
const panel=document.getElementById('panel'), distEl=document.getElementById('distance'), durEl=document.getElementById('duration'), destEl=document.getElementById('dest');
const speedEl=document.getElementById('speedValue'), speedSourceEl=document.getElementById('speedSource');
const headingEl=document.getElementById('headingValue'), headingDetailEl=document.getElementById('headingDetail');
const map=L.map('map',{zoomControl:true}).setView([36.2,138.2],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

let current=null,currentMarker=null,accuracyCircle=null,destMarker=null,routeLine=null,watchId=null,firstFix=true;
let followMode=true,lastFix=null,gpsFault=false;
function setStatus(s){statusEl.textContent=s}

function toRad(v){return v*Math.PI/180}
function toDeg(v){return v*180/Math.PI}
function distanceMeters(a,b){
  const R=6371000;
  const dLat=toRad(b.lat-a.lat), dLon=toRad(b.lon-a.lon);
  const la1=toRad(a.lat), la2=toRad(b.lat);
  const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}
function bearingDegrees(a,b){
  const la1=toRad(a.lat), la2=toRad(b.lat), dLon=toRad(b.lon-a.lon);
  const y=Math.sin(dLon)*Math.cos(la2);
  const x=Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dLon);
  return (toDeg(Math.atan2(y,x))+360)%360;
}
function headingLabel(deg){
  const labels=['北','北東','東','南東','南','南西','西','北西'];
  return labels[Math.round(deg/45)%8];
}
function clearMotion(reason='測位待ち'){
  speedEl.textContent='--';
  speedSourceEl.textContent=reason;
  headingEl.textContent='--';
  headingDetailEl.textContent=reason;
}
function updateMotion(c,timestamp){
  const now={
    lat:c.latitude,
    lon:c.longitude,
    accuracy:Number.isFinite(c.accuracy)?c.accuracy:9999,
    time:timestamp||Date.now()
  };

  const reliableAccuracy=now.accuracy<=60;

  let speedMps=null, speedSource='';
  if(reliableAccuracy && Number.isFinite(c.speed) && c.speed>=0){
    speedMps=c.speed;
    speedSource='端末GPS';
  }else if(lastFix){
    const dt=(now.time-lastFix.time)/1000;
    const d=distanceMeters(lastFix,now);
    if(dt>=0.8 && dt<=10 && d>=2 && Math.max(now.accuracy,lastFix.accuracy)<=60){
      speedMps=d/dt;
      speedSource='位置差から推定';
    }
  }
  if(speedMps!==null && speedMps*3.6<=250){
    speedEl.textContent=String(Math.round(speedMps*3.6));
    speedSourceEl.textContent=speedSource;
  }else{
    speedEl.textContent='--';
    speedSourceEl.textContent=reliableAccuracy?'速度取得不可':'GPS精度低下';
  }

  let heading=null, headingSource='';
  if(reliableAccuracy && Number.isFinite(c.heading) && c.heading>=0){
    heading=((c.heading%360)+360)%360;
    headingSource='端末GPS';
  }else if(lastFix){
    const d=distanceMeters(lastFix,now);
    if(d>=5 && Math.max(now.accuracy,lastFix.accuracy)<=60){
      heading=bearingDegrees(lastFix,now);
      headingSource='移動方向から推定';
    }
  }
  if(heading!==null){
    headingEl.textContent=headingLabel(heading);
    headingDetailEl.textContent=Math.round(heading)+'° ・ '+headingSource;
  }else{
    headingEl.textContent='--';
    headingDetailEl.textContent=reliableAccuracy?'方角取得不可':'GPS精度低下';
  }
  lastFix=now;
}
function gpsError(e){
  gpsFault=true;
  lastFix=null;
  if(e&&e.code===1&&watchId!==null){
    navigator.geolocation.clearWatch(watchId);
    watchId=null;
  }
  const msg=e&&e.code===1?'位置情報が拒否されています。ブラウザ設定でこのサイトの位置情報を「許可」にしてください。':
            e&&e.code===2?'現在地を取得できません。GPS/Wi-Fi/モバイル通信を確認してください。':
            e&&e.code===3?'GPS取得がタイムアウトしました。屋外で「現在地へ」を押してください。':
            '現在地を取得できません。';
  clearMotion('GPSエラー');
  setStatus(msg);
}
function onPosition(p){
  gpsFault=false;
  const c=p.coords;
  current=[c.latitude,c.longitude];
  const acc=Math.round(c.accuracy||0);
  if(currentMarker) currentMarker.setLatLng(current);
  else currentMarker=L.marker(current).addTo(map).bindPopup('現在地');
  if(accuracyCircle) accuracyCircle.setLatLng(current).setRadius(c.accuracy||0);
  else accuracyCircle=L.circle(current,{radius:c.accuracy||0,weight:1,fillOpacity:.08}).addTo(map);

  updateMotion(c,p.timestamp);
  if(firstFix){
    map.setView(current,16);
    firstFix=false;
  }else if(followMode){
    map.panTo(current,{animate:false});
  }
  setStatus('GPS受信中：精度 約'+acc+'m'+(acc>60?'（GPS精度低下）':'')+(followMode?' ・ 地図追従中':' ・ 地図追従停止'));
}
function startGps(){
  if(!navigator.geolocation){clearMotion('未対応');setStatus('このブラウザでは位置情報を利用できません。');return}
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  firstFix=true;
  followMode=true;
  lastFix=null;
  clearMotion();
  setStatus('GPSを取得しています…');
  watchId=navigator.geolocation.watchPosition(onPosition,gpsError,{
    enableHighAccuracy:true,
    timeout:20000,
    maximumAge:1000
  });
}
function recenter(){
  followMode=true;
  if(current) map.setView(current,16);
  if(!current||gpsFault||watchId===null){
    startGps();
    return;
  }
  setStatus('現在地を中心に戻しました。地図追従を再開します。');
}

async function searchDest(){
  const text=q.value.trim(); if(!text){setStatus('目的地を入力してください');return}
  setStatus('目的地を検索しています…');
  try{
    const u='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&accept-language=ja&q='+encodeURIComponent(text);
    const r=await fetch(u); const data=await r.json();
    if(!data.length){setStatus('目的地が見つかりませんでした');return}
    const d=[+data[0].lat,+data[0].lon];
    if(destMarker) destMarker.setLatLng(d).setPopupContent(data[0].display_name);
    else destMarker=L.marker(d).addTo(map).bindPopup(data[0].display_name);
    destMarker.openPopup();
    destEl.textContent=data[0].display_name;
    if(current) await drawRoute(current,d);
    else {map.setView(d,15);setStatus('目的地を表示しました。GPS取得後に経路表示できます。')}
  }catch(e){setStatus('検索に失敗しました。通信状態を確認してください。')}
}
async function drawRoute(a,b){
  setStatus('ルートを計算しています…');
  try{
    const u='https://router.project-osrm.org/route/v1/driving/'+a[1]+','+a[0]+';'+b[1]+','+b[0]+'?overview=full&geometries=geojson';
    const r=await fetch(u); const data=await r.json();
    if(!data.routes||!data.routes.length) throw new Error();
    const route=data.routes[0], pts=route.geometry.coordinates.map(x=>[x[1],x[0]]);
    if(routeLine) map.removeLayer(routeLine);
    routeLine=L.polyline(pts,{weight:7,opacity:.8}).addTo(map);
    map.fitBounds(routeLine.getBounds(),{padding:[30,30]});
    distEl.textContent=(route.distance/1000).toFixed(1)+' km';
    durEl.textContent='約'+Math.max(1,Math.round(route.duration/60))+'分';
    panel.style.display='block';
    setStatus('ルート表示中。GPSは継続測位しています。');
  }catch(e){setStatus('ルート計算に失敗しました。目的地は地図上に表示しています。')}
}

document.getElementById('search').onclick=searchDest;
document.getElementById('locate').onclick=recenter;
q.addEventListener('keydown',e=>{if(e.key==='Enter')searchDest()});
map.on('dragstart',()=>{
  followMode=false;
  if(current) setStatus('地図を手動操作中です。「現在地へ」で追従を再開できます。');
});
map.on('click',async e=>{
  if(destMarker) destMarker.setLatLng(e.latlng); else destMarker=L.marker(e.latlng).addTo(map);
  destEl.textContent='地図で指定した地点';
  if(current) await drawRoute(current,[e.latlng.lat,e.latlng.lng]);
});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
document.getElementById('voice').onclick=()=>{
  if(!SR){setStatus('このブラウザは音声入力に対応していません。キーボード入力を使ってください。');return}
  const r=new SR(); r.lang='ja-JP'; r.interimResults=false; r.maxAlternatives=1;
  setStatus('目的地を話してください…');
  r.onresult=e=>{q.value=e.results[0][0].transcript;searchDest()};
  r.onerror=()=>setStatus('音声入力に失敗しました。');
  r.start();
};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&watchId===null)startGps()});
window.addEventListener('beforeunload',()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId)});
startGps();
</script>
</body>
</html>
